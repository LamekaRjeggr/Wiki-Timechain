<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- No key lives here. The writes are the accept and the refuse (kind 8828, plus the 30829 that
     names your timeline), signed by a NIP-07 extension or a resumed bunker; with the local chip on
     they reach only your add= relay. ws: is here for the lab relay
     (?relay=ws://127.0.0.1:7777); every http(s) channel stays barred. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  worker-src 'self';
  style-src 'unsafe-inline';
  connect-src wss: ws://127.0.0.1:7777;
  base-uri 'none';
  form-action 'none'">
<title>Wiki-Timechain · dots</title>
<script>
  // theme before first paint; shares the viewer's choice (wtc:theme = medium | light)
  try { const t = localStorage.getItem("wtc:theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch {}
</script>
<style>
:root{
  --bg:#0e1014; --panel:#151920; --line:#2a3140;
  --t0:#e6e9ef; --t1:#9aa3b2; --t2:#7b8596;
  --sub:#6ea8fe;   /* submitted — the author's signature */
  --acc:#e0b04a;   /* accepted — the notary's signature */
  --sep:#dcc3a3;   /* summary — warm sepia, apart from the white title and grey content */
  --mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{--bg:#f4f3ef;--panel:#ffffff;--line:#d5d2c8;--t0:#1a1c20;--t1:#4c5260;--t2:#6b707c;--sub:#2a63c9;--acc:#9a6a0c;--sep:#7a5a38}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 var(--mono);min-height:100vh;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-inline:16px}
a{color:var(--sub)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
del{color:var(--t2)} ins{text-decoration:none;color:var(--t0)}
.lhost{color:var(--t2);font-size:12px}
.lhost::before{content:" ⟨"} .lhost::after{content:"⟩"}

header{display:flex;gap:18px;align-items:baseline;padding-block:12px 6px;flex-wrap:wrap;width:100%}
header .ntry{color:var(--t2);flex:1 1 0;min-width:0} header .a{color:var(--acc)} header .ntry b{color:var(--acc);font-weight:400} header .ntry button{color:var(--t1)}
header .st{margin-left:auto;color:var(--t2);font-size:12px;white-space:nowrap} header #bst{margin-left:auto} header #bst:empty{display:none} header #bst + .st{margin-left:0}
header .chip{border:1px solid var(--line);border-radius:9px;padding:0 7px;color:var(--t1)} header .chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)} header .chip.gold{background:var(--acc);color:var(--bg);border-color:var(--acc)}   /* gold: the chip that acts on what you checked */ header .title{color:var(--t2);border-bottom:1px dotted var(--line)} header select{font:inherit;color:var(--t1);background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:22ch}   /* a chip: folded until pressed; the you chip fills when the filter is on */

main{display:grid;grid-template-rows:auto 1fr;width:100%}   /* the whole window: the line wants every px of width */
#top{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:10px;min-width:0}   /* header, band and ledger stay while the column scrolls under them; min-width:0 = a long ledger line cannot widen the grid item and shove the band (hover jitter) */
#band{position:relative;user-select:none;overflow:hidden;cursor:grab} #band.drag{cursor:grabbing}   /* height = what the line needs to reach the window's right edge; an edge ring sits on the band edge and is cut to a half: more, that way */
#now{position:absolute;top:-14px;height:30px;width:0;border-left:1px dashed var(--t1)}
#now i{position:absolute;top:100%;left:4px;font-size:11px;font-style:normal;color:var(--t1)}
.tick{position:absolute;top:-30px;font-size:11px;color:var(--t2);transform:translateX(-50%);white-space:nowrap}
.tick::before{content:"";position:absolute;bottom:-14px;left:50%;height:3px;width:1px;background:var(--t2)}
.dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:1.5px solid var(--sub);background:transparent;opacity:.6}   /* one card: a hollow, quiet mark; the size says how many cards sit under it */
.dot::before{content:"";position:absolute;inset:-10px}   /* the finger gets 31px, the eye keeps the dot */
.dot.acc{border-color:var(--acc)}
.dot.many{opacity:1;background:var(--sub);color:#000;font:bold 10px var(--mono)} .dot.many.acc{background:var(--acc)}   /* the count sits inside once the dot is big enough */
.dot.future{background:transparent}
.dot.ref{opacity:.2}   /* a version you refused, unfolded: on the band, barely */
.dot.edge{opacity:1;border-color:var(--t1);color:var(--t1);font:11px var(--mono);background:var(--bg);z-index:2}   /* cards beyond this end: a half ring with their count, grown by it like any dot */
.dot:hover,.dot.on,.dot:focus-visible{outline:2px solid var(--t0);outline-offset:2px}
.tail{position:absolute;height:3px;background:var(--line);transform:translateY(-50%)}   /* a timeline's reach, first card to last */
.bar{position:absolute;height:0;border-top:1.5px solid;color:var(--sub);opacity:.6;transform-origin:0 0;transform:rotate(22deg);pointer-events:none} .bar.acc{color:var(--acc)} .bar.ref{opacity:.2} .bar.on{opacity:1}   /* a card's span: a flat rule from its dot to under its end date, above the title; every date has its own height on the line, so rules never share one */
.bar::after{content:"";position:absolute;right:0;top:-3px;height:5px;border-right:1px solid}   /* the end says where it stops */
#empty{position:absolute;left:0;right:0;top:48px;text-align:center;color:var(--t2)}
/* the line IS the column — it rises 22° from the seat at the left edge; the open card sits at the seat, the rest fall away up and right */
#line{position:absolute;left:0;height:0;border-top:1px solid var(--t2);transform-origin:0 0;transform:rotate(-22deg)}   /* years above the line, titles below: two planes, nothing crosses */
#line .ttl{position:absolute;top:14px;margin-left:7px;transform-origin:0 0;transform:rotate(22deg);white-space:nowrap;line-height:1;color:var(--t1);pointer-events:none} #line .ttl.alt{color:var(--sep)} #line .ttl i{color:var(--t2);font-style:normal}   /* every other title warm: the eye keeps its row */   /* a title rides its dot, turned back flat; its chars, size and ink fall with the years from the seat */

#ledger{height:22px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ledger b{color:var(--t0);font-weight:400}
#ledger .a{color:var(--acc)} #ledger .s{color:var(--sub)} #ledger .t2{color:var(--t2)}

#card{max-width:68ch;align-self:start;margin:14px 0 24px;display:grid;gap:14px}   /* every card, in date order; the one nearest the top is open */
#card::after{content:"";height:60vh}   /* room for the last card to reach the top */
#card:empty{display:none}
.c{padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sub)}
.c.acc{border-left-color:var(--acc)} .c.on{box-shadow:0 0 0 1px var(--t1)}
.c.ref{border-left-style:dashed;opacity:.6} #card .refs{margin-top:16px;font-size:12px;color:var(--t2);border-top:1px solid var(--line);padding-top:6px}   /* refused: one closing line, the cards behind it on request */
#card h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--t0);text-wrap:balance}
#card:not(.menu) h2{font-family:var(--sans);font-size:18px;line-height:1.3;letter-spacing:-.01em}
#card .when{font-size:13px;color:var(--t1);margin-bottom:2px} #card .when i{color:var(--t2);font-style:normal}   /* the event's own axis: when, then what */
#card .a{color:var(--acc)} .actions .a{border:1px solid var(--acc);padding:0 6px}   /* the ✓ N pill */
#card .abtn{border:1px dashed var(--acc);color:var(--acc);padding:0 6px} #card .abtn:disabled{opacity:.5;cursor:default}
#card .rbtn{border:1px dashed var(--t2);color:var(--t2);padding:0 6px} #card .rbtn:disabled{opacity:.5;cursor:default}   /* refuse / restore: the grey twin of the accept pill */   /* the same pill, dashed = not yet: press it and it fills */
#card .rec,#card .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--t2)}   /* two rules below the fact: the record (who wrote it, its json), then your act on it */
#card .rec b{font-weight:400;color:var(--t1)} #card .rec .rawbtn{margin-left:auto;color:var(--t2)} #card pre.raw{margin:6px 0 0;font-size:11px;line-height:1.4;color:var(--t2);white-space:pre-wrap;word-break:break-all}
#card .actions button{padding:2px 8px;border-radius:4px}
#card .sum{color:var(--sep);margin:0 0 12px;font:500 14px/1.5 var(--sans)}   /* summary = the plain fact, full size, sepia */
#card p{margin:0 0 10px;color:var(--t1);font:14px/1.6 var(--sans)}   /* prose is for reading; the surrounding record and provenance stay mono */
#card .vers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
#card .vers button{border:1px dashed var(--line);padding:1px 8px;font-size:12px;color:var(--t1)}
#card .vers button.on{border-style:solid;border-color:var(--t1)}
#card .day{margin:16px 0 4px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--line)} #card .day:first-child{margin-top:0}
#card .dayend{width:48px;margin:-4px 0 6px;border-bottom:1px solid var(--line)}   /* a short rule closes the day group, so the next card reads as its own day */
#card.menu{gap:4px} #card.menu .c{padding:8px 12px} .c.tl h2{margin:0;display:flex;gap:12px;align-items:baseline} .c.tl .go{color:var(--t0);text-align:left} .c.tl .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--t2);white-space:nowrap} .c.tl .sum{margin:4px 0 0} .c.tl .drop{color:var(--t2);font-size:12px} .c.tl .row .row{margin:6px 0 0 calc(14px + 4px);padding-left:10px;border-left:2px solid var(--line)} .c.tl .fold{color:var(--t2);width:14px;text-align:left} .c.tl .pick{color:var(--t2)} .c.tl .pick[aria-pressed="true"]{color:var(--acc)} .c.tl .drop[data-arm]{color:var(--acc)} .c.tl .row.on > h2 .go{color:var(--acc)}   /* a timeline row: title (the door), count, its summary — the menu, and a source inside a timeline */

@media (max-width:640px){ header{gap:10px} header .st{margin-left:0} }
</style>
</head>
<body>

<main>
  <div id="top">
    <header>
      <span class="ntry" id="ntry"></span>
      <span class="st" id="bst"></span><span class="st" id="st">connecting…</span>
    </header>
    <div id="band" aria-label="timeline, one dot per card"><div id="empty" hidden>no cards yet</div></div>
    <div id="ledger">&nbsp;</div>
  </div>
  <section id="card" aria-label="the cards, in date order"></section>
</main>

<script type="module">
import { fold8828 } from "./lib/fold-8828.mjs";
import { dotsOf, byDate, sourcesOf, sourceSubjects } from "./lib/dots-derive.mjs?v=5";   /* bump when the lib changes shape: a cached old copy kills the page at import */

const Q = new URLSearchParams(location.search);
const MAIN = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.mostr.pub",
  "wss://relay.nostr.band", "wss://offchain.pub", "wss://nostr.mom"];
const RELAYS = Q.get("relay") ? Q.get("relay").split(",") : [...MAIN, ...(Q.get("add") || "").split(",").filter(Boolean)];   // relay= replaces the network, add= joins it
const KIND = 30828, ACT_KIND = 8828, NOTARY_KIND = 30829, MARKER = "wikitimechain";

// ── state ──
const notaries = new Map();   // coord → newest 30829
const cards = new Map();      // pubkey:d → newest 30828
const acts = new Map();       // id → 8828 (only if the act AND its snapshot verified)
const actE = new Set();       // act ids we hold — a revoke carries no `a`, so it is fetched by #e
const profiles = new Map();   // pubkey → name
const vOK = new Set(), vBad = new Set(), sockets = [];
let want = Q.get("c"), coord = null, askT = null, open = null, dots = [], renderT = null, colKey = null;
let me = Q.get("me") === "1", local = Q.get("local") === "1", names = false, nested = Q.get("nested") === "1" || !!Q.get("pick"), picked = new Set((Q.get("pick") || "").split(",").filter(Boolean)), multi = !!Q.get("pick"), unfolded = new Set(), byD = new Map(), refused = new Map(), showRef = false, raw = new Set();   // nested: the room of timelines that point at timelines; picked: rows checked there; multi: those timelines' cards on one band; unfolded: their rows opened in place; byD: that room's dots by d   // refused: card id → my whole-card refusal in the open timeline; showRef: the refused cards unfolded below the column   // raw: card ids whose json is open   // me: the page narrows to your marks (cards you wrote, cards your notary holds); names: the notary chip unfolded
const TA = 22 * Math.PI / 180, SEAT = 46, YR = 864e5 * 365.25; let ppy = null, seatD = null;   // seat = the open card, SEAT px in from the line's foot; ppy = px per year, fixed once to fit the record from the first seat, wheel changes it
let myPk = null; try { myPk = localStorage.getItem("wtc:pk") || JSON.parse(localStorage.getItem("wtc:signin") || "{}").pk || null; } catch {}
const NOW = new Date().toISOString().slice(0, 10);

// ── the gate: every event is id-hashed and signature-checked before it counts — in a pool of workers, so the page never waits on the math ──
const pend = new Map();   // id → { ev, fns } out for verify; a copy from another relay joins the wait instead of being checked again
const pool = Array.from({ length: Math.min(8, navigator.hardwareConcurrency || 2) }, () => {
  const w = new Worker("./lib/verify-worker.mjs", { type:"module" }); w.onmessage = ({ data:[id, ok] }) => settle(id, ok); return w; });
let rr = 0;
const seenOn = new Map();   // id → Set(relay url): a card no MAIN relay has echoed is "local" — still on this machine
const isLocal = id => ![...(seenOn.get(id) || [])].some(u => MAIN.includes(u));
function admit(ev, fn, url){
  if (!ev || !/^[0-9a-f]{64}$/.test(String(ev.id)) || vBad.has(ev.id)) return;
  const s = seenOn.get(ev.id) || seenOn.set(ev.id, new Set()).get(ev.id); if (Q.get("add") && !s.has(url) && MAIN.includes(url)) schedule(); s.add(url);   // a main echo moves a card from the local side to the nostr side
  if (vOK.has(ev.id)) return fn(ev);
  const p = pend.get(ev.id); if (p) return p.fns.push(fn);
  pend.set(ev.id, { ev, fns:[fn] }); pool[rr++ % pool.length].postMessage([ev.id, ev]);
}
function settle(id, ok){
  const { ev, fns } = pend.get(id); pend.delete(id);
  if (ok){ vOK.add(id); fns.forEach(fn => fn(ev)); } else { vBad.add(id); console.warn("dots: dropped", id); }
}

// ── ingest ──
const tag = (ev, n) => (ev.tags.find(t => t[0] === n) || [])[1] || "";
function ingestNotary(ev){
  const d = tag(ev, "d"); if (!d) return;
  const c = NOTARY_KIND + ":" + ev.pubkey + ":" + d, cur = notaries.get(c);
  if (cur && cur.created_at >= ev.created_at) return;
  notaries.set(c, ev);
  if (!coord && want === d) choose(d);
  clearTimeout(askT); askT = setTimeout(ask, 300); schedule();
}
function ingestCard(ev){
  const d = tag(ev, "d"); if (!d) return;
  const k = ev.pubkey + ":" + d, cur = cards.get(k);
  if (cur && cur.created_at >= ev.created_at) return;
  cards.set(k, ev); askProfile(ev.pubkey); schedule();
}
function ingestAct(ev){
  if (acts.has(ev.id)) return;
  const keep = () => { acts.set(ev.id, ev); if (!actE.has(ev.id)){ actE.add(ev.id); clearTimeout(askT); askT = setTimeout(ask, 300); } schedule(); };
  let snap = null; try { snap = JSON.parse(tag(ev, "snapshot") || "null"); } catch {}
  // the act's signature cannot vouch for the card it carries — that snapshot walks the gate too
  snap && snap.id ? admit(snap, s => { askProfile(s.pubkey); keep(); }) : keep();
}
function ingestProfile(ev){
  let name = ""; try { const p = JSON.parse(ev.content); name = p.display_name || p.name || ""; } catch {}
  profiles.set(ev.pubkey, name.trim()); schedule();
}
const who = pk => profiles.get(pk) || "unnamed";   // a hash in the header says "for developers"; a missing profile is just unnamed
let profT = null; const wantProf = new Set();
function askProfile(pk){
  if (profiles.has(pk) || wantProf.has(pk)) return;
  wantProf.add(pk);
  if (profT) return;
  profT = setTimeout(() => { profT = null;
    send(["REQ", "prof", { kinds:[0], authors:[...wantProf].filter(p => !profiles.has(p)) }]); }, 300);
}

// ── relays ──
const send = m => sockets.forEach(ws => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(m)));
const write = ev => sockets.forEach(ws => ws.readyState === WebSocket.OPEN && !(local && MAIN.includes(ws.relay)) && ws.send(JSON.stringify(["EVENT", ev])));   // the chip on `local` = your acts stay on your relay; the network never hears them
let asked = "";
function ask(){   // one sub over every timeline known so far; same sub id = the relay swaps the filter AND replays it, so re-send only what grew
  const cs = [...new Set([...notaries.keys(), ...[...notaries.values()].flatMap(sourcesOf)])]; if (!cs.length) return;   // one hop out: a source's cards and acts too
  if (asked !== cs.join()){ asked = cs.join(); send(["REQ", "wtc", { kinds:[KIND], "#a":cs }]); }
  send(["REQ", "act", { kinds:[ACT_KIND], "#a":cs }, ...(actE.size ? [{ kinds:[ACT_KIND], "#e":[...actE] }] : [])]);
}
let up = 0;
function connect(url){
  let ws; try { ws = new WebSocket(url); } catch { return; }
  ws.relay = url; sockets.push(ws);
  ws.onopen = () => { up++; status(); ws.send(JSON.stringify(["REQ", "ntry", { kinds:[NOTARY_KIND], "#t":[MARKER] }])); asked = ""; ask(); };   // a late relay has heard nothing yet
  ws.onmessage = m => {
    let d; try { d = JSON.parse(m.data); } catch { return; }
    if (d[0] !== "EVENT") return;
    if (d[1] === "ntry") admit(d[2], ingestNotary, url);
    if (d[1] === "wtc")  admit(d[2], ingestCard, url);
    if (d[1] === "act")  admit(d[2], ingestAct, url);
    if (d[1] === "prof") admit(d[2], ingestProfile, url);
  };
  ws.onclose = ws.onerror = () => status();
}
const status = () => { st.textContent = `${sockets.filter(w => w.readyState === WebSocket.OPEN).length}/${RELAYS.length} relays`; };

// a timeline is its subject `d`, whole — every notary that carries that d pours its dots in, then ONE dot per card:
// gold if any notary accepted it, blue otherwise; `accs` = the notaries that did (the ✓ N pill), so the band never repeats a card
const notariesOf = d => [...notaries.entries()].filter(([c]) => c.split(":").slice(2).join(":") === d);
function dotsFor(d, projections, all){
  const byId = new Map();
  for (const [c] of notariesOf(d)) for (const x of dotsOf(c, projections, all)){
    const cur = byId.get(x.id) || byId.set(x.id, { ...x, kind:"sub", accs:[] }).get(x.id);
    if (x.kind === "acc"){ cur.accs.push(c); Object.assign(cur, x, { kind:"acc", accs:cur.accs }); }   // an accepted projection carries the notary's selected fields
  }
  return [...byId.values()].sort(byDate);
}
const titleOf = d => notariesOf(d).map(([, n]) => tag(n, "title")).find(Boolean) || d, summaryOf = d => notariesOf(d).map(([, n]) => tag(n, "summary")).find(Boolean) || "";
function subjectDot(d, projections, all, hop = true){   // a whole timeline as ONE dot at its earliest card, coloured by whether any card is held, reaching to its last; null when empty
  const dl = dotsFor(d, projections, all).filter(x => keep(x, d)), ns = notariesOf(d);
  const srcs = hop ? sourceSubjects(ns.map(([, n]) => n)).map(x => subjectDot(x, projections, all, false)).filter(Boolean) : [];   // a head reaches as far as the timelines it points at; one hop
  const mineEmpty = ns.some(([c]) => c === myCoordOf(d)) && !dl.length && !srcs.length;   // my own head, still empty: it stays on the menu so it can be filled, dot at today
  if (!dl.length && !srcs.length && !mineEmpty) return null;
  const first = [...dl, ...srcs].sort(byDate)[0] || { id:"tl:" + d, author:ns[0][1].pubkey, created_at:ns[0][1].created_at, accs:[], date:new Date().toISOString().slice(0, 10) };
  const dot = { ...first, date:first.date.split("/")[0], tl:d, tls:[d], card:dl[0], d, title:titleOf(d), summary:summaryOf(d), last:[...dl.map(x => x.date), ...srcs.map(x => x.last)].sort().pop() || first.date,
    n:dl.length, nTl:srcs.length, mem:srcs, nAcc:dl.filter(x => x.kind === "acc").length, ns:ns.map(([, n]) => who(n.pubkey)), all:new Map(dl.map(x => [x.id, x])) };
  dot.kind = dot.nAcc ? "acc" : "sub";
  return dot;
}
function choose(c){   // c = a subject d → that timeline; null → the timeline of timelines
  coord = c; open = null; want = null; seatD = null; ppy = null; card.innerHTML = ""; colKey = null; scrollTo(0, 0);
  setUrl(); schedule();
}
function setUrl(){   // c= and me= ride the URL so a reload or a shared link lands on the same view
  const q = new URLSearchParams(); if (coord) q.set("c", coord); if (nested && !coord) q.set("nested", "1"); if (multi && !coord && picked.size) q.set("pick", [...picked].join(",")); if (me) q.set("me", "1"); if (local) q.set("local", "1");
  for (const k of ["relay", "add"]) if (Q.get(k)) q.set(k, Q.get(k));
  history.replaceState(null, "", "?" + q);
}
const keep = (x, d) => (!Q.get("add") || local === isLocal(x.id)) && (!me || !myPk || x.author === myPk || x.accs.includes(NOTARY_KIND + ":" + myPk + ":" + d));   // the you filter: yours by hand or by seal; a card of yours someone re-wrote is theirs now
const localChip = () => Q.get("add") ? ` · <button class="chip${local ? " on" : ""}" id="localbtn" aria-pressed="${local}" title="${local ? "cards only your relay has · click for the network" : "cards the network has · click for your relay only"}">${local ? "local" : "nostr"}</button>` : "";   // a two-sided switch, never both: only when an add= relay is in the room
const tlPick = () => {   // point my head at another timeline; taking one off is the ✕ on its row

      if (mx(b) - mx(a) < ((SZ(a.length) + SZ(b.length)) / 2 + 2) * fm(b[0])){ gs.splice(i, 2, a.concat(b)); i = Math.max(0, i - 1); } else i++;
    }
    groups.push(...gs);
  }
  for (const x of dots) if (x.last > x.date && T(x.last) > W0 && T(x.date) < W1){ const e = document.createElement("div"); e.className = "tail"; e.style.top = AY + "px";
    e.style.left = X(Math.max(0, x.x)); e.style.width = Wd(Math.min(100, frac(T(x.last), W0, W1) * 100) - Math.max(0, x.x)); host.insertBefore(e, host.firstChild); }
  // a span card draws a flat rule from its dot to under its end date, above its title; below 2px it is only its dot
  for (const x of dots){
    if (!endOf(x.date) || (refused.has(x.id) && !showRef)) continue;
    const x0 = xp(frac(T(x.date), W0, W1)), x1 = xp(frac(T(endOf(x.date)), W0, W1)); if (x1 < SEAT || x0 > L || x1 - x0 < 2) continue;
    const b = document.createElement("div"); b.className = "bar " + x.kind + (refused.has(x.id) ? " ref" : "") + (open === x.i ? " on" : "");
    b.style.left = x0 + "px"; b.style.top = side(x) * OFF + "px"; b.style.width = (Math.min(x1, L) - x0) * Math.cos(TA) + "px"; host.appendChild(b);   // flat on the screen: its length is the line's run times cos22
  }
  groups.sort((a, b) => mx(a) - mx(b)).forEach((ids, gi) => {
    const cx = ids.reduce((s, x) => s + x.x, 0) / ids.length, n = ids.length;
    ids.sort((a, b) => (a.kind === "acc" ? 0 : 1) - (b.kind === "acc" ? 0 : 1) || b.created_at - a.created_at);
    ids.forEach(x => x.g = gi);
    const x = ids[0], e = document.createElement("button");
    e.className = "dot " + x.kind + (n > 1 ? " many" : "") + (ids.every(o => refused.has(o.id)) ? " ref" : "") + (x.date > NOW ? " future" : "") + (open !== null && dots[open] && dots[open].g === gi ? " on" : "");
    e.dataset.i = x.i; e.dataset.g = gi; e.style.left = X(cx); e.style.top = AY + side(x) * OFF + "px"; e.style.width = e.style.height = SZ(n) + "px";
    if (n > 1 && SZ(n) >= 15) e.textContent = n;
    const o = ids.includes(dots[open]) ? dots[open] : x, px = SEAT + cx * PX, last = lbls[lbls.length - 1];   // the open card names its group; flat titles stack at gap·sin22, so groups nearer than a line-height share one label
    if (last && px - last.px < 14 / Math.sin(TA)) last.n += n; else lbls.push({ px, n, d:dist(o), t:o.title || o.summary || "" });
    const lo = ids.reduce((m, o) => o.date < m ? o.date : m, x.date), hi = ids.reduce((m, o) => o.date > m ? o.date : m, x.date);
    e.setAttribute("aria-label", n === 1 ? showDate(x.date) + " " + x.title : `${n} here, ${lo} to ${hi}`);
    e.onclick = () => go(x.i); e.onmouseenter = () => line(x.i);
    e.onmouseleave = () => line(open);
    host.appendChild(e);
  });
  lbls.forEach(({ px, n, d, t }, li) => {   // the title, flat, hung from the dot: years from the seat take its size (13→8) and ink (1→.25); its chars = what fits to the window's edge
    const fs = Math.max(8, 13 - d * 0.055), k = Math.max(3, Math.floor((band.clientWidth - px * Math.cos(TA) - 20) / (fs * 0.6)) - (n > 1 ? 4 : 0)), l = document.createElement("span"); l.className = "ttl" + (li % 2 ? " alt" : ""); l.style.left = px + "px"; l.style.fontSize = fs + "px"; l.style.opacity = Math.max(0.25, 1 - d * 0.011);
    l.innerHTML = esc(t.length > k ? t.slice(0, k - 1) + "…" : t) + (n > 1 ? ` <i>+${n - 1}</i>` : ""); host.appendChild(l);
  });
  // cards beyond an edge: a half ring on that end with their count; click brings the nearest in
  const seen = dots.filter(x => showRef || !refused.has(x.id)); for (const [side, off] of [["l", seen.filter(x => x.x < 0)], ["r", seen.filter(x => x.x > 100)]]){
    if (!off.length) continue;
    const n = off.length, near = off.reduce((m, o) => (side === "l" ? o.date > m.date : o.date < m.date) ? o : m, off[0]), lo = off.reduce((m, o) => o.date < m ? o.date : m, off[0].date), hi = off.reduce((m, o) => o.date > m ? o.date : m, off[0].date);
    const e = document.createElement("button"); e.className = "dot edge"; e.textContent = n;
    const d = Math.max(32, SZ(n)); e.style.left = (side === "l" ? 0 : L) + "px"; e.style.top = AY + "px"; e.style.width = e.style.height = d + "px";
    e.style[side === "l" ? "paddingLeft" : "paddingRight"] = d / 2 + "px"; e.style[side === "l" ? "paddingRight" : "paddingLeft"] = "0";   // the count sits mid-way across the half that shows
    e.setAttribute("aria-label", `${n} beyond, ${lo} to ${hi}, click brings the nearest in`);
    e.onclick = () => go(near.i); e.onmouseenter = () => { ledger.innerHTML = `<b>${n} beyond</b> · ${lo} → ${hi} · <span class="t2">click brings the nearest in</span>`; }; e.onmouseleave = () => line(open);
    host.appendChild(e);
  }

  column(); if (dots.length) show(open !== null && dots[open] ? open : 0, false); else line(null);   // something is always open: the first card until the reader moves
}

function line(i){
  if (i === null || !dots[i]){
    ledger.innerHTML = "&nbsp;"; return; }
  const x = dots[i], vers = dots.filter(o => o.d === x.d).length, same = x.g === null ? 0 : dots.filter(o => o.g === x.g).length - 1;
  ledger.innerHTML = x.tl ? `<b>${esc(x.title)}</b> · ${countOf(x)}${same > 0 ? ` · ${same} more here` : ""}`
    : `<b>${esc(showDate(x.date))}</b> · ${esc(x.title || x.summary || x.content.slice(0, 60))} · ${accsOf(x.id).length ? mark(accsOf(x.id).length) : `<span class="s">submitted</span>`} · ${esc(who(x.author))}${vers > 1 ? ` · ${vers} versions` : ""}${same > 0 ? ` · ${same} more here` : ""}${refused.has(x.id) ? " · refused" : ""}`;
}
function article(x){   // one card's block in the column; a timeline's block leads with its collection line and an open ▸
  const c = x.card || x, accs = accsOf(c.id), i = x.i, vers = dots.filter(o => o.d === x.d);
  const drop = x.tl && coord && canSign() && sourcesOf(notaries.get(myCoord()) || { tags:[] }).some(c => c.endsWith(":" + x.tl));   // my head points at it: the row carries its ✕
  if (x.tl){
    if (nested && !coord && !x.nTl && !multi) return "";   // in the nested room a member shows inside its pointer's row, not as its own
    return `<article class="c tl${x.kind === "acc" ? " acc" : ""}" data-i="${i}">${tlRow(x, drop)}</article>`;
  }   // a timeline row: title, count, the notary's own summary
  const ref = refused.has(c.id), held = ref && x.accs.includes(myCoord()) ? "<span>still accepted</span>" : "";   // a refusal hides; it does not withdraw
  const actions = [accs.length ? mark(accs.length) : "", abtn(x), rbtn(x), held].filter(Boolean).join("");   // the act row: what notaries did, then what you can do
  const ev = raw.has(c.id) && [...cards.values()].find(e => e.id === c.id);   // the record itself, opened: d, id, sig, created_at all live here, not on the card
  return `<article class="c${x.kind === "acc" ? " acc" : ""}${ref ? " ref" : ""}" data-i="${i}">
  <div class="when">${esc(showDate(c.date))}${c.time ? " " + esc(c.time) : ""}${c.date > NOW ? " <i>· upcoming</i>" : ""}</div>
  <h2>${esc(c.title) || "<i>untitled</i>"}</h2>
  ${c.summary ? `<div class="sum">${esc(c.summary)}</div>` : ""}
  ${prose(c.content)}
  ${vers.length > 1 ? `<div class="vers">${vers.map(o => `<button data-i="${o.i}"${o.i === i ? ' class="on"' : ""}>${esc(who(o.author))} · ${new Date(o.created_at * 1000).toISOString().slice(0, 10)}${accsOf(o.id).length ? " " + mark(accsOf(o.id).length) : ""}</button>`).join("")}</div>` : ""}
  <div class="rec"><b>${esc(who(c.author))}</b>${isMine(c) ? "· yours" : ""}${x.of ? `· in <b>${esc(titleOf(x.of))}</b>` : ""}<button class="rawbtn" data-id="${esc(c.id)}" aria-expanded="${!!ev}">json ${ev ? "▾" : "▸"}</button></div>
  ${ev ? `<pre class="raw">${esc(JSON.stringify(ev, null, 1))}</pre>` : ""}
  ${actions ? `<div class="actions" aria-label="Card actions">${actions}</div>` : ""}</article>`;
}
function tlRow(x, drop = false, depth = 0){   // a timeline's row: title = the door, count, summary; in the nested room a ▸ unfolds the timelines it points at, so you see inside before entering
  const kids = nested && !coord && x.nTl ? x.mem.map(m => byD.get(m.d) || m) : [], on = unfolded.has(x.tl), pk = nested && !coord && !multi && x.n;   // pk: in the room a timeline holding cards can be checked for the many-at-once view
  return `<div class="row" data-d="${esc(x.tl)}"><h2>${kids.length ? `<button class="fold" data-d="${esc(x.tl)}" aria-expanded="${on}">${on ? "▾" : "▸"}</button>` : ""}${pk ? `<button class="pick" data-d="${esc(x.tl)}" aria-pressed="${picked.has(x.tl)}" title="${picked.has(x.tl) ? "uncheck" : "check, to view with others"}">${picked.has(x.tl) ? "▣" : "▢"}</button>` : ""}<button class="go" data-d="${esc(x.tl)}">${esc(x.title)}</button><span class="n">${countOf(x)}${x.nAcc ? ` · ${mark(x.nAcc)}` : ""}${drop ? ` <button class="drop" data-d="${esc(x.tl)}" title="take this timeline off yours">✕</button>` : ""}</span></h2>${x.summary ? `<div class="sum">${esc(x.summary)}</div>` : ""}${on ? kids.map(k => tlRow(k, false, depth + 1)).join("") : ""}</div>`;
}
const countOf = x => [x.n ? `${x.n} card${x.n === 1 ? "" : "s"}` : "", x.nTl ? `${x.nTl} timeline${x.nTl === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ") || "empty";   // cards it holds, timelines it points at — both when both
function column(){   // rebuilt only when the cards themselves change, so a zoom never loses the reader's place
  const key = dots.map(x => x.id + x.kind + (x.tl ? x.tl + x.title + x.summary + x.n + x.nTl + unfolded.has(x.tl) + picked.has(x.tl) : "") + accsOf(x.id).length + (refused.has(x.id) ? "r" : "") + (raw.has(x.id) ? "j" : "")).join("|") + canSign() + myPk + showRef; if (key === colKey) return; colKey = key;   // myPk: the first sign tells the page who you are, and your pills change
  card.classList.toggle("menu", !coord);
  const vis = dots.filter(x => !refused.has(x.id)), refs = dots.filter(x => refused.has(x.id));   // refused cards leave the column; one line at its end holds them
  card.innerHTML = vis.map((x, i) => {
    if (x.tl) return article(x);   // the menu: titles only, no day lines
    // a day holding several cards gets a day line above its group: the neighbours are visible, nothing is claimed about them
    const g = vis.filter(o => o.date === x.date), end = g.length > 1 && x.date !== vis[i + 1]?.date ? '<div class="dayend"></div>' : "";
    if (x.date === vis[i - 1]?.date) return article(x) + end;
    if (g.length < 2) return article(x);
    const ts = g.map(o => (o.card || o).time).filter(Boolean);
    return `<div class="day">${esc(showDate(x.date))} · ${g.length} ${coord ? "cards" : "timelines"}${ts.length ? ` · ${esc(ts[0])}${ts.length > 1 ? " → " + esc(ts[ts.length - 1]) : ""}` : ""}</div>` + article(x) + end;
  }).join("") + (refs.length ? `<div class="refs"><button class="peek">${refs.length} refused ${showRef ? "▾" : "▸"}</button></div>${showRef ? refs.map(article).join("") : ""}` : "");
  card.querySelectorAll(".vers button").forEach(b => b.onclick = () => go(+b.dataset.i));
  card.querySelectorAll(".rawbtn").forEach(b => b.onclick = () => { raw.has(b.dataset.id) ? raw.delete(b.dataset.id) : raw.add(b.dataset.id); column(); });   // the card grows; the column scrolls, the json never does on its own
  card.querySelectorAll(".go").forEach(b => b.onclick = () => choose(b.dataset.d));
  card.querySelectorAll(".fold").forEach(b => b.onclick = () => { unfolded.has(b.dataset.d) ? unfolded.delete(b.dataset.d) : unfolded.add(b.dataset.d); colKey = null; column(); });
  card.querySelectorAll(".pick").forEach(b => b.onclick = () => { picked.has(b.dataset.d) ? picked.delete(b.dataset.d) : picked.add(b.dataset.d); colKey = null; render(); });
  card.querySelectorAll(".drop").forEach(b => b.onclick = () => {   // two taps: the first arms it and says so, the second takes the timeline off; it disarms by itself
    if (!b.dataset.arm){ b.dataset.arm = "1"; b.textContent = "remove?"; b.title = "click again to take it off"; setTimeout(() => { delete b.dataset.arm; b.textContent = "✕"; b.title = "take this timeline off yours"; }, 4000); return; }
    setSources(sourcesOf(notaries.get(myCoord())).filter(c => !c.endsWith(":" + b.dataset.d))); });
  card.querySelectorAll(".abtn").forEach(b => b.onclick = () => { b.disabled = true; (b.dataset.w ? withdraw(+b.dataset.w) : accept(+b.dataset.i)).catch(() => { b.disabled = false; b.textContent = "declined · try again"; }); });
  card.querySelectorAll(".rbtn").forEach(b => b.onclick = () => { b.disabled = true; (b.dataset.r ? withdraw(+b.dataset.r, "refuse") : refuse(+b.dataset.i)).catch(() => { b.disabled = false; b.textContent = "declined · try again"; }); });
  const pk = card.querySelector(".peek"); if (pk) pk.onclick = () => { showRef = !showRef; render(); };   // unfold or fold the refused cards, page-local
}
function show(i, scroll = true){   // open = card i: its dot and block light up; scroll = bring the block under the map
  const x = dots[i]; open = i; line(i); if (scroll && dots.length){ const [W0, W1] = windowOf(), t = T(x.date); if (t < W0) seatD = x.date; else if (t >= W1) seatD = new Date(t - (W1 - W0) * 2 / 3).toISOString(); if (t < W0 || t >= W1) render(); }   // the line holds still; only aiming at a card off the line (dot, arrow, edge ring, version button) slides it, and by the least: an earlier card lands at the seat, a later one 2/3 up the line, so what you had stays in view — a render or the scroll-spy never moves it   // the ledger carries the open one's count and span: the menu row is only a title
  band.querySelectorAll(".dot").forEach(e => e.classList.toggle("on", +e.dataset.g === x.g));
  band.querySelectorAll("#arcs path").forEach(e => e.classList.toggle("on", +e.dataset.i === i));
  if (scroll && nested && !coord && x.tl && !x.nTl){ for (const t of byD.values()) if (t.nTl && t.mem.some(m => m.d === x.tl)) unfolded.add(t.tl); column(); }   // a member's dot opens the rows that hold it
  const art = card.querySelector(`article[data-i="${i}"]`) || card.querySelector(`.row[data-d="${CSS.escape(x.tl || "")}"]`)?.closest("article"); card.querySelectorAll("article").forEach(e => e.classList.toggle("on", e === art));
  card.querySelectorAll(".row").forEach(e => e.classList.toggle("on", x.tl && e.dataset.d === x.tl));
  if (scroll && art) scrollTo(0, scrollY + art.getBoundingClientRect().top - mapEl.offsetHeight - 14);   // the map sticks at the top once the header has scrolled off, so aim under its stuck height, not where it sits now
}
const go = i => { if (refused.has(dots[i]?.id) && !showRef){ showRef = true; render(); } show(i); };   // aiming at a refused card unfolds the closing line

// ── controls ──
const ntry = document.getElementById("ntry"),
  st = document.getElementById("st"), band = document.getElementById("band"), empty = document.getElementById("empty"),
  ledger = document.getElementById("ledger"), card = document.getElementById("card"), mapEl = document.getElementById("top");
// wheel over the band: the seat holds, the years stretch or squeeze
const zoom = k => { ppy = Math.max(0.2, Math.min(400, ppy * k)); render(); };
band.addEventListener("wheel", e => { e.preventDefault(); zoom(e.deltaY > 0 ? 0.8 : 1.25); }, { passive:false });
// drag the line: the seat's date follows the pointer along the line and stays there on release. A drag past 4px swallows the click that ends it, so a dot under the pointer stays closed
let pull = null;   // {x, y, seat, moved}
band.onpointerdown = ev => { if (!dots.length || ev.button) return; pull = { x: ev.clientX, y: ev.clientY, seat: T(seatD || dots[0].date), moved: false, id: ev.pointerId }; };   // no capture yet: a capture retargets the click to the band and a dot could never open
band.onpointermove = ev => {
  if (!pull || !ev.buttons) return; const d = (ev.clientX - pull.x) * Math.cos(TA) - (ev.clientY - pull.y) * Math.sin(TA);   // px along the line, which rises to the right
  if (!pull.moved && Math.abs(d) < 4) return; if (!pull.moved){ pull.moved = true; band.classList.add("drag"); band.setPointerCapture(pull.id); } seatD = new Date(pull.seat - d / ppy * YR).toISOString(); render();
};
band.onpointerup = () => { if (!pull) return; swallow = pull.moved; pull = null; band.classList.remove("drag"); };   // the seat stays where the drag left it
let swallow = false; band.addEventListener("click", ev => { if (swallow){ swallow = false; ev.stopPropagation(); } }, true);
// keys anywhere on the page: left/right = next card in date order (on the line or not), up/down = zoom, home/end = first/last card, escape = fit the record from the seat
document.addEventListener("keydown", e => {
  if (e.target.matches("select,input,textarea") || !dots.length) return;
  const z = { ArrowUp: 1.25, ArrowDown: 0.8 }[e.key], k = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (z) zoom(z); else if (k) go(Math.max(0, Math.min(dots.length - 1, (open ?? -1) + k))); else if (e.key === "Home") go(0); else if (e.key === "End") go(dots.length - 1); else if (e.key === "Escape"){ ppy = null; render(); } else return;
  e.preventDefault();
});
// scrolling the column: the block under the map is the open one — its dot lights and the window grows to hold it
addEventListener("scroll", () => {
  const at = mapEl.getBoundingClientRect().bottom + 30; let hit = null;   // show() parks a block 14px under the map; Safari lands a fraction off, so the threshold sits well past that or the spy snaps `open` straight back
  for (const a of card.querySelectorAll("article")) if (a.getBoundingClientRect().top <= at) hit = a; else break;
  const i = hit ? +hit.dataset.i : 0; if (card.children.length && i !== open) show(i, false);
}, { passive:true });

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });   // label thinning depends on width
render();
RELAYS.forEach(connect);
</script>
</body>
