<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- No key lives here. The writes are the accept and the refuse (kind 8828, plus the 30829 that
     names your timeline), signed by a NIP-07 extension or a resumed bunker; with the local chip on
     they reach only your add= relay. ws: is here for a relay you run
     yourself (?relay=ws://…); every http(s) channel stays barred. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  worker-src 'self';
  style-src 'unsafe-inline';
  connect-src wss: ws:;
  base-uri 'none';
  form-action 'none'">
<title>Wiki-Timechain · dots</title>
<script>
  // theme before first paint; shares the viewer's choice (wtc:theme = medium | light)
  try { const t = localStorage.getItem("wtc:theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch {}
</script>
<style>
:root{
  --bg:#0e1014; --panel:#151920; --line:#2a3140;
  --t0:#e6e9ef; --t1:#9aa3b2; --t2:#7b8596;
  --sub:#6ea8fe;   /* submitted — the author's signature */
  --acc:#e0b04a;   /* accepted — the notary's signature */

  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
:root[data-theme="light"]{--bg:#f4f3ef;--panel:#ffffff;--line:#d5d2c8;--t0:#1a1c20;--t1:#4c5260;--t2:#6b707c;--sub:#2a63c9;--acc:#9a6a0c;--sep:#7a5a38}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 var(--mono);min-height:100vh;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-inline:16px}

header{display:flex;gap:18px;align-items:baseline;padding-block:12px 6px;flex-wrap:wrap;width:100%}
header .ntry{color:var(--t2);flex:1 1 0;min-width:0} header .a{color:var(--acc)} header .ntry b{color:var(--acc);font-weight:400} header .ntry button{color:var(--t1)}

header .chip{border:1px solid var(--line);border-radius:9px;padding:0 7px;color:var(--t1)} header .chip.on{background:var(--t1);color:var(--bg);border-color:var(--t1)} header .chip.gold{background:var(--acc);color:var(--bg);border-color:var(--acc)}   /* gold: the chip that acts on what you checked */ header .title{color:var(--t2);border-bottom:1px dotted var(--line)} header select{font:inherit;color:var(--t1);background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:22ch}   /* a chip: folded until pressed; the you chip fills when the filter is on */

main{display:grid;grid-template-rows:auto 1fr;width:100%}   /* the whole window: the line wants every px of width */
#top{position:sticky;top:0;z-index:2;background:var(--bg);min-width:0}   /* header and band stay while the column scrolls under them; min-width:0 = a long header line cannot widen the grid item and shove the band */
#band{position:relative;user-select:none;overflow:hidden;cursor:grab;touch-action:none} #band.drag{cursor:grabbing}   /* height = what the line needs to reach the window's right edge; an edge ring sits on the band edge and is cut to a half: more, that way */
#now{position:absolute;top:-44px;height:44px;width:0;border-left:1px dashed var(--t1)}   /* now rises from the line, above the year row; below the line is the titles' plane, nothing of now crosses it */
#now i{position:absolute;bottom:100%;left:4px;font-size:11px;font-style:normal;color:var(--t1);white-space:nowrap}
.tick{position:absolute;top:-30px;font-size:11px;color:var(--t2);transform:translateX(-50%);white-space:nowrap}
.tick::before{content:"";position:absolute;bottom:-14px;left:50%;height:3px;width:1px;background:var(--t2)}
.dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%) rotate(22deg);border:1.5px solid var(--sub);background:transparent;opacity:.6}   /* one card: a hollow, quiet mark; the size says how many cards sit under it; turned back flat so its count reads (a tilted 7 read as 1) */
.dot::before{content:"";position:absolute;inset:-10px}   /* the finger gets 31px, the eye keeps the dot */
.dot.acc{border-color:var(--acc)}
.dot.many{opacity:1;background:var(--sub);color:#000;font:bold 10px var(--mono)} .dot.many.acc{background:var(--acc)}   /* the count sits inside once the dot is big enough */
.dot.future{background:transparent}
.dot.ref{opacity:.2}   /* a version you refused, unfolded: on the band, barely */
.dot.edge{opacity:1;border-color:var(--t1);color:var(--t1);font:11px var(--mono);background:var(--bg);z-index:2}   /* cards beyond this end: a half ring with their count, grown by it like any dot */
.dot:hover,.dot.on,.dot:focus-visible{outline:2px solid var(--t0);outline-offset:2px}
.nib{position:absolute;width:1px;background:var(--t2);transform:translate(-50%,-50%);pointer-events:none}   /* a moment: cards no zoom can part stand on a stem off their side of the line */
#line .mo{position:absolute;font:bold 11px var(--mono);color:var(--t1);transform-origin:0 0;transform:rotate(22deg) translate(-50%,-100%);white-space:nowrap;pointer-events:none}   /* the moment's date, flat, centred over its column */
.dot.tl{border:0;border-radius:0;background:none;opacity:1;isolation:isolate;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-end;padding:0 0 2px;color:#000;font:bold 10px var(--mono);transform:translate(-50%,-100%)} .dot.tl.sub{transform:translate(-50%,0);align-items:flex-start;padding:2px 0 0} .dot.tl b{transform:rotate(22deg)}   /* a head turns with the line, base on its point: accepted stands above, submitted hangs below; only its count turns back flat */
.dot.tl::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--sub);clip-path:polygon(50% 0,100% 100%,0 100%)} .dot.tl.sub::after{clip-path:polygon(0 0,100% 0,50% 100%)} .dot.tl.acc::after{background:var(--acc)} .dot.tl.unfolded::before{content:"";position:absolute;inset:5px 4px 3px;z-index:0;background:var(--bg);clip-path:polygon(50% 0,100% 100%,0 100%)} .dot.tl.sub.unfolded::before{inset:3px 4px 5px;clip-path:polygon(0 0,100% 0,50% 100%)} .dot.tl.unfolded b{display:none}   /* timeline: a triangle, its base on the line; unfolded = hollow, its members are out on the line */
.dot.tw,.dot.tw.sub{align-items:center;padding:0} .dot.tw::after,.dot.tw.sub::after{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .dot.tw.unfolded::before,.dot.tw.sub.unfolded::before{inset:4px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}   /* timetree: a diamond, its tip on the point */
.dot.tl.on,.dot.tl:hover,.dot.tl:focus-visible{outline:0;box-shadow:0 3px 0 -1px var(--t0)} .dot.tl.sub.on,.dot.tl.sub:hover,.dot.tl.sub:focus-visible{box-shadow:0 -3px 0 -1px var(--t0)}   /* the open head is underlined along its rule */
.bar i{position:absolute;top:-3.75px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor} .bar i.t{top:-4.75px;width:8px;height:8px;margin-left:-4px;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}   /* a timeline's rule carries a bead per thing it holds, at its date: a dot per card, a small triangle per timeline */
.bar{position:absolute;height:0;border-top:1.5px solid;color:var(--sub);opacity:.6;transform-origin:0 0;transform:rotate(22deg);pointer-events:none} .bar.acc{color:var(--acc)} .bar.ref{opacity:.2} .bar.on{opacity:1}   /* a card's span: a flat rule from its dot to under its end date, above the title; every date has its own height on the line, so rules never share one */
.bar.end::after{content:"";position:absolute;right:0;top:-4px;height:8px;border-right:2px solid}   /* the end says where it stops — only a true end; a span cut by the line's top runs off it bare */
#empty{position:absolute;left:0;right:0;top:48px;text-align:center;color:var(--t2)}
/* the line IS the column — it rises 22° from the seat at the left edge; the open card sits at the seat, the rest fall away up and right */
#line{position:absolute;left:0;height:0;border-top:1px solid var(--t2);transform-origin:0 0;transform:rotate(-22deg)}   /* years above the line, titles below: two planes, nothing crosses */
#line .ttl.l{margin-left:0;transform:rotate(22deg) translateX(-100%)}   /* runs left from its point: a column member above the line, where the line falls away leftward */
#line .ttl{position:absolute;top:17px;margin-left:7px;font-size:13px;transform-origin:0 0;transform:rotate(22deg);white-space:nowrap;line-height:1;color:var(--t1);pointer-events:none} #line .ttl.alt{color:var(--sep)} #line .ttl i{color:var(--t2);font-style:normal}   /* every other title warm: the eye keeps its row */   /* a title rides its dot, turned back flat, one size; only its chars fall to the window edge */


#card{max-width:68ch;align-self:start;margin:14px 0 24px;display:grid;gap:14px;overflow-anchor:none}   /* every card, in date order; the one nearest the top is open; the seat keeps the scroll, not the browser */
#card::after{content:"";height:100vh}   /* room for the last card to reach the foot */
#card:empty{display:none}
#card{margin-left:var(--seat,46px)} #card .c+.c{border-top:1px solid var(--t2);padding-top:14px}   /* the column starts under the foot, flush with the seat; the top card is the line's bottom node; every card at full ink, the darkest rule on the page parts one card from the next */
.c.ref{opacity:.6} #card .refs{margin-top:16px;font-size:12px;color:var(--t2);border-top:1px solid var(--line);padding-top:6px}   /* refused: one closing line, the cards behind it on request */
#card h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--t0);text-wrap:balance}
#card h2{font-family:var(--sans);font-size:18px;line-height:1.3;letter-spacing:-.01em}
#card .when{font-size:13px;color:var(--t1);margin-bottom:2px} #card .when i{color:var(--t2);font-style:normal}   /* the event's own axis: when, then what */
#card .a{color:var(--acc)} .actions .a{border:1px solid var(--acc);padding:0 6px}   /* the ✓ N pill */
#card .abtn{border:1px dashed var(--acc);color:var(--acc);padding:0 6px} #card .abtn:disabled{opacity:.5;cursor:default}
#card .rbtn{border:1px dashed var(--t2);color:var(--t2);padding:0 6px} #card .rbtn:disabled{opacity:.5;cursor:default}   /* refuse / restore: the grey twin of the accept pill */   /* the same pill, dashed = not yet: press it and it fills */
#card .rec,#card .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--t2)}   /* two rules below the fact: the record (who wrote it, its json), then your act on it */
#card .rec b{font-weight:400;color:var(--t1)} #card .rec .rawbtn{margin-left:auto;color:var(--t2)} #card pre.raw{margin:6px 0 0;font-size:11px;line-height:1.4;color:var(--t2);white-space:pre-wrap;word-break:break-all}
#card .actions button{padding:2px 8px;border-radius:4px}
#card .sum{color:var(--sep);margin:0 0 12px;font:500 14px/1.5 var(--sans)}   /* summary = the plain fact, full size, sepia */
#card p{margin:0 0 10px;color:var(--t1);font:14px/1.6 var(--sans)}   /* prose is for reading; the surrounding record and provenance stay mono */
#card .vers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
#card .vers button{border:1px dashed var(--line);padding:1px 8px;font-size:12px;color:var(--t1)}
#card .vers button.on{border-style:solid;border-color:var(--t1)}
#card .day{margin:0 0 4px;padding-top:14px;border-top:1px solid var(--t2);font-size:12px;color:var(--t2);border-bottom:1px solid var(--line)} #card .day:first-child{padding-top:0;border-top:0}   /* a new day: its line takes the card rule's place */
.c.tl h2{margin:0;display:flex;gap:12px;align-items:baseline} .c.tl .go{color:var(--t0);text-align:left} .c.tl .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--t2);white-space:nowrap} .c.tl .sum{margin:4px 0 0} .c.tl .drop{color:var(--t2);font-size:12px} .c.tl .fold{color:var(--t2);width:14px;text-align:left} .c.tl .drop[data-arm]{color:var(--acc)} .c.tl .row.on > h2 .go{color:var(--acc)}   /* a timeline row: title (the door), count, its summary — the menu, and a source inside a timeline */

@media (max-width:640px){ header{gap:10px} header .st{margin-left:0} }
[hidden]{display:none!important}
/* the Library: the first screen — big type, word buttons, one column; timetrees and timelines never share a list */
header .libh{font:700 24px var(--sans);color:var(--t0)} header .who{margin-left:20px;font:16px var(--sans);color:var(--t2)} header .who button{font:600 17px var(--sans);color:var(--t0);border:2px solid var(--t1);border-radius:8px;padding:4px 14px}
#lib{width:100%;max-width:720px;margin:8px auto 60px;font:18px/1.45 var(--sans);color:var(--t1)}

#lib .tabs button[aria-selected="true"]{color:var(--t0);font-weight:700;border-color:var(--t0)} #lib .tabs button:disabled{opacity:.4;cursor:default}
#lib h3{margin:22px 0 0;font-size:20px;color:var(--t0)} #lib h3 i{font-style:normal;font-weight:400;color:var(--t2)} #lib .plain{margin:0 0 4px;font-size:16px;color:var(--t2)}
#lib .lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 14px;margin-top:8px;border:2px solid var(--line);border-radius:10px;background:var(--panel);text-align:left}
#lib .lrow:hover,#lib .lrow:focus-visible{border-color:var(--t1);outline:none} #lib .lrow b{display:block;font-size:19px;font-weight:600;color:var(--t0)} #lib .lrow small{display:block;font-size:15px;color:var(--t2)}
#lib .go1,#lib .big{margin-left:auto;flex:none;font:600 17px var(--sans);color:var(--bg);background:var(--t1);border-radius:8px;padding:8px 18px} #lib .big{margin:22px 0 0}
#lib form{display:flex;gap:10px} #lib input{flex:1;min-width:0;font:19px var(--sans);padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--t0)} #lib input:focus{outline:none;border-color:var(--t1)}
#lib .note{margin:24px 0 0;font-size:18px} #lib .note i{font-style:normal;color:var(--t2)}
</style>

<body>

<main>
  <div id="top">
    <header>
      <span class="ntry" id="ntry"></span>

</main>

<script type="module">
import { fold8828 } from "./lib/fold-8828.mjs";
import { dotsOf, byDate, timeMin, sourcesOf, sourceSubjects } from "./lib/dots-derive.mjs?v=5";   /* bump when the lib changes shape: a cached old copy kills the page at import */

const Q = new URLSearchParams(location.search);
const HOME = /^(127\.0\.0\.1|localhost|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(location.hostname);   // the page served from this machine or its LAN: the local copy
const ADD = Q.get("add") ?? (HOME && !Q.get("relay") ? "ws://127.0.0.1:7777" : ""), LOCAL0 = HOME && !!ADD;   // the local copy brings the lab relay and opens on the local side; add= (even empty) says otherwise
const MAIN = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.ditto.pub",
  "wss://offchain.pub", "wss://nostr.mom", "wss://relay.nostr.net"];
const RELAYS = (Q.get("relay") ? Q.get("relay").split(",") : [...MAIN, ...(ADD || "").split(",").filter(Boolean)]).map(u => /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? u : u.replace(/127\.0\.0\.1|localhost/, location.hostname));   // relay= replaces the network, add= joins it; a loopback relay follows the page's host, so one URL serves the Mac and the iPad
const KIND = 30828, ACT_KIND = 8828, NOTARY_KIND = 30829, MARKER = "wikitimechain";

// ── state ──
const notaries = new Map();   // coord → newest 30829
const cards = new Map();      // pubkey:d → newest 30828
const acts = new Map();       // id → 8828 (only if the act AND its snapshot verified)
const actE = new Set();       // act ids we hold — a revoke carries no `a`, so it is fetched by #e
const profiles = new Map();   // pubkey → name
const vOK = new Set(), vBad = new Set(), sockets = [];
let trail = (Q.get("p") || "").split(",").filter(Boolean), tab = null;   // trail: the timetrees walked through to get here, oldest first; tab: the Library tab picked by hand
let fitK = null, want = Q.get("c"), coord = null, askT = null, open = null, dots = [], renderT = null, colKey = null;
let me = Q.get("me") === "1", local = Q.has("local") ? Q.get("local") === "1" : LOCAL0, names = false, unfolded = new Set((Q.get("u") || "").split(",").filter(Boolean)), refused = new Map(), showRef = false, raw = new Set();   // unfolded: timelines whose members ride this view — on the line and in the column
const TA = 22 * Math.PI / 180, SEAT = 150, YR = 864e5 * 365.25, ROW = 17; let ppy = null, seatD = null;   // ROW = one title row on the screen, px; seat = the open card, SEAT px in from the line's foot; ppy = px per year, fixed once to fit the record from the first seat, wheel changes it
let myPk = null; try { myPk = localStorage.getItem("wtc:pk") || JSON.parse(localStorage.getItem("wtc:signin") || "{}").pk || null; } catch {}
const NOW = new Date().toISOString().slice(0, 10);
document.documentElement.style.setProperty("--seat", Math.round(SEAT * Math.cos(TA)) + "px");   // the column hangs under the seat, wherever the seat sits on the line

// ── the gate: every event is id-hashed and signature-checked before it counts — in a pool of workers, so the page never waits on the math ──
const pend = new Map();   // id → { ev, fns } out for verify; a copy from another relay joins the wait instead of being checked again
const pool = Array.from({ length: Math.min(8, navigator.hardwareConcurrency || 2) }, () => {
  const w = new Worker("./lib/verify-worker.mjs", { type:"module" }); w.onmessage = ({ data:[id, ok] }) => settle(id, ok); return w; });
let rr = 0;
const seenOn = new Map();   // id → Set(relay url): a card no MAIN relay has echoed is "local" — still on this machine
const isLocal = id => ![...(seenOn.get(id) || [])].some(u => MAIN.includes(u));
function admit(ev, fn, url){
  if (!ev || !/^[0-9a-f]{64}$/.test(String(ev.id)) || vBad.has(ev.id)) return;
  const s = seenOn.get(ev.id) || seenOn.set(ev.id, new Set()).get(ev.id); if (ADD && !s.has(url) && MAIN.includes(url)) schedule(); s.add(url);   // a main echo moves a card from the local side to the nostr side
  if (vOK.has(ev.id)) return fn(ev);

  pend.set(ev.id, { ev, fns:[fn] }); pool[rr++ % pool.length].postMessage([ev.id, ev]);
}
function settle(id, ok){
  const { ev, fns } = pend.get(id); pend.delete(id);
  if (ok){ vOK.add(id); fns.forEach(fn => fn(ev)); } else { vBad.add(id); console.warn("dots: dropped", id); }
}

// ── ingest ──
const tag = (ev, n) => (ev.tags.find(t => t[0] === n) || [])[1] || "";
const gone = new Map();   // what a kind 5 took back: id → its author, or kind:pk:d → as of when; a copy arriving later from another relay stays out
const isGone = ev => gone.get(ev.id) === ev.pubkey || (gone.get(ev.kind + ":" + ev.pubkey + ":" + tag(ev, "d")) ?? -1) >= ev.created_at;
function ingestDelete(ev){   // NIP-09: only the author can take a record back; a coord takes every version up to the delete's own time
  for (const [n, v] of ev.tags){
    if (n === "e" && v) gone.set(v, ev.pubkey);
    if (n === "a" && v && v.split(":")[1] === ev.pubkey) gone.set(v, Math.max(gone.get(v) ?? -1, ev.created_at)); }

}
function ingestNotary(ev){
  const d = tag(ev, "d"); if (!d || isGone(ev)) return;
  const c = NOTARY_KIND + ":" + ev.pubkey + ":" + d, cur = notaries.get(c);
  if (cur && cur.created_at >= ev.created_at) return;

  if (!coord && want === d) choose(d, trail);
  clearTimeout(askT); askT = setTimeout(ask, 300); schedule();
}
function ingestCard(ev){
  const d = tag(ev, "d"); if (!d || isGone(ev)) return;
  const k = ev.pubkey + ":" + d, cur = cards.get(k);
  if (cur && cur.created_at >= ev.created_at) return;
  cards.set(k, ev); askProfile(ev.pubkey); if (!askedDel.includes(ev.pubkey)){ clearTimeout(askT); askT = setTimeout(ask, 300); } schedule();
}
function ingestAct(ev){

  return (w.length || !n ? `<h3>Timetrees${c(w.length)}</h3><p class="plain">Groups of timelines</p>${w.map(lrow).join("") || `<p class="note"><i>None yet.</i></p>`}` : "")
    + (t.length || !n ? `<h3>Timelines${c(t.length)}</h3><p class="plain">Lists of events</p>${t.map(lrow).join("") || `<p class="note"><i>None yet.</i></p>`}` : ""); };
let libKey = "";
function library(){   // My collection = the timelines you keep as a notary; Search everyone lists them all, and typing filters it — timetrees always first
  const cur = myPk ? tab || "mine" : "find", q = document.getElementById("q").value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
  const mine = dots.filter(x => myPk && x.tls.some(d => notaries.has(myCoordOf(d)))).sort((a, b) => a.title.localeCompare(b.title));
  const hits = dots.filter(x => { const h = [x.title, x.summary, ...x.tls].join(" ").toLowerCase(); return words.every(w => h.includes(w)); }).sort((a, b) => a.title.localeCompare(b.title));
  const key = cur + q + canSign() + loading() + [...mine, ...hits].map(x => x.tl + x.title + x.n + x.nTl).join("|"); if (key === libKey) return; libKey = key;
  tmine.disabled = !myPk; tmine.setAttribute("aria-selected", cur === "mine"); tfind.setAttribute("aria-selected", cur === "find");
  pmine.hidden = cur !== "mine"; pfind.hidden = cur !== "find"; nosign.hidden = !!myPk;
  pmine.innerHTML = libList(mine) + (canSign() ? `<button class="big" id="newtl">New timeline</button>` : "");
  fres.innerHTML = hits.length ? libList(hits, true) : `<p class="note">${loading() ? "Looking…" : q ? `Nothing found for “${esc(q)}”.` : "No timelines yet."}</p>`;
  lib.querySelectorAll(".lrow").forEach(b => b.onclick = () => choose(b.dataset.d));
  const nt = document.getElementById("newtl"); if (nt) nt.onclick = newTimeline;
}
async function signIn(){   // an extension signs in here; without one, add.html holds the sign-in and this page rides its session
  if (typeof window.nostr?.getPublicKey !== "function") return void (location.href = "add.html");
  myPk = await window.nostr.getPublicKey(); try { localStorage.setItem("wtc:pk", myPk); } catch {} tab = null; render();
}

function article(x){   // one card's block in the column; a timeline's block leads with its collection line and an open ▸
  const c = x.card || x, accs = accsOf(c.id), i = x.i, vers = dots.filter(o => o.d === x.d);
  const drop = x.tl && coord && canSign() && sourcesOf(notaries.get(myCoord()) || { tags:[] }).some(c => c.endsWith(":" + x.tl));   // my head points at it: the row carries its ✕
  if (x.tl){
    return `<article class="c tl${x.kind === "acc" ? " acc" : ""}" data-i="${i}">${tlRow(x, drop)}</article>`;
  }   // a timeline row: title, count, the notary's own summary
  const ref = refused.has(c.id), held = ref && x.accs.includes(myCoord()) ? "<span>still accepted</span>" : "";   // a refusal hides; it does not withdraw
  const actions = [accs.length ? mark(accs.length) : "", abtn(x), rbtn(x), held].filter(Boolean).join("");   // the act row: what notaries did, then what you can do
  const ev = raw.has(c.id) && [...cards.values()].find(e => e.id === c.id);   // the record itself, opened: d, id, sig, created_at all live here, not on the card
  return `<article class="c${x.kind === "acc" ? " acc" : ""}${ref ? " ref" : ""}" data-i="${i}">
  <div class="when">${esc(showDate(c.date))}${c.time ? " " + esc(c.time) : ""}${c.date > NOW ? " <i>· upcoming</i>" : ""}</div>
  <h2>${esc(c.title) || "<i>untitled</i>"}</h2>
  ${c.summary ? `<div class="sum">${esc(c.summary)}</div>` : ""}
  ${prose(c.content)}
  ${vers.length > 1 ? `<div class="vers">${vers.map(o => `<button data-i="${o.i}"${o.i === i ? ' class="on"' : ""}>${esc(who(o.author))} · ${new Date(o.created_at * 1000).toISOString().slice(0, 10)}${accsOf(o.id).length ? " " + mark(accsOf(o.id).length) : ""}</button>`).join("")}</div>` : ""}
  <div class="rec"><b>${esc(who(c.author))}</b>${isMine(c) ? "· yours" : ""}${x.of ? `· in <b>${esc(titleOf(x.of))}</b>` : ""}<button class="rawbtn" data-id="${esc(c.id)}" aria-expanded="${!!ev}">json ${ev ? "▾" : "▸"}</button></div>
  ${ev ? `<pre class="raw">${esc(JSON.stringify(ev, null, 1))}</pre>` : ""}
  ${actions ? `<div class="actions" aria-label="Card actions">${actions}</div>` : ""}</article>`;
}
function tlRow(x, drop = false){   // a timeline's row: title = the door, count, summary; ▸ unfolds its members onto this view, ▾ folds them back
  const on = unfolded.has(x.tl);
  return `<div class="row" data-d="${esc(x.tl)}"><h2>${x.n || x.nTl ? `<button class="fold" data-d="${esc(x.tl)}" aria-expanded="${on}" title="${on ? "fold its members away" : "unfold its members onto the line"}">${on ? "▾" : "▸"}</button>` : ""}<button class="go" data-d="${esc(x.tl)}">${esc(x.title)}</button><span class="n">${countOf(x)}${x.nAcc ? ` · ${mark(x.nAcc)}` : ""}${x.of ? ` · in <b>${esc(titleOf(x.of))}</b>` : ""}${drop ? ` <button class="drop" data-d="${esc(x.tl)}" title="take this timeline off yours">✕</button>` : ""}</span></h2>${x.summary ? `<div class="sum">${esc(x.summary)}</div>` : ""}</div>`;
}
const countOf = x => [x.n ? `${x.n} card${x.n === 1 ? "" : "s"}` : "", x.nTl ? `${x.nTl} timeline${x.nTl === 1 ? "" : "s"}` : ""].filter(Boolean).join(" · ") || "empty";   // cards it holds, timelines it points at — both when both
function column(){   // rebuilt only when the cards themselves change, so a zoom never loses the reader's place
  const key = dots.map(x => x.id + x.kind + (x.tl ? x.tl + x.title + x.summary + x.n + x.nTl + unfolded.has(x.tl) : "") + accsOf(x.id).length + (refused.has(x.id) ? "r" : "") + (raw.has(x.id) ? "j" : "")).join("|") + canSign() + myPk + showRef; if (key === colKey) return; colKey = key;   // myPk: the first sign tells the page who you are, and your pills change
  const vis = dots.filter(x => !refused.has(x.id)), refs = dots.filter(x => refused.has(x.id));   // refused cards leave the column; one line at its end holds them
  card.innerHTML = vis.map((x, i) => {
    if (x.tl) return article(x);   // the menu: titles only, no day lines
    // a day holding several cards gets a day line above its group: the neighbours are visible, nothing is claimed about them
    const g = vis.filter(o => o.date === x.date);
    if (x.date === vis[i - 1]?.date) return article(x);
    if (g.length < 2) return article(x);
    const ts = g.map(o => (o.card || o).time).filter(Boolean);
    return `<div class="day">${esc(showDate(x.date))} · ${g.length} ${coord ? "cards" : "timelines"}${ts.length ? ` · ${esc(ts[0])}${ts.length > 1 ? " → " + esc(ts[ts.length - 1]) : ""}` : ""}</div>` + article(x);
  }).join("") + (refs.length ? `<div class="refs"><button class="peek">${refs.length} refused ${showRef ? "▾" : "▸"}</button></div>${showRef ? refs.map(article).join("") : ""}` : "");
  card.querySelectorAll(".vers button").forEach(b => b.onclick = () => go(+b.dataset.i));
  card.querySelectorAll(".rawbtn").forEach(b => b.onclick = () => { raw.has(b.dataset.id) ? raw.delete(b.dataset.id) : raw.add(b.dataset.id); column(); });   // the card grows; the column scrolls, the json never does on its own
  card.querySelectorAll(".go").forEach(b => b.onclick = () => choose(b.dataset.d, coord ? [...trail, coord] : []));   // going into a timeline from a timetree: the path grows by one
  card.querySelectorAll(".fold").forEach(b => b.onclick = () => { unfolded.has(b.dataset.d) ? unfolded.delete(b.dataset.d) : unfolded.add(b.dataset.d); setUrl(); render(); });   // the members join or leave the line and the column
  card.querySelectorAll(".drop").forEach(b => b.onclick = () => {   // two taps: the first arms it and says so, the second takes the timeline off; it disarms by itself
    if (!b.dataset.arm){ b.dataset.arm = "1"; b.textContent = "remove?"; b.title = "click again to take it off"; setTimeout(() => { delete b.dataset.arm; b.textContent = "✕"; b.title = "take this timeline off yours"; }, 4000); return; }
    setSources(sourcesOf(notaries.get(myCoord())).filter(c => !c.endsWith(":" + b.dataset.d))); });
  card.querySelectorAll(".abtn").forEach(b => b.onclick = () => { b.disabled = true; (b.dataset.w ? withdraw(+b.dataset.w) : accept(+b.dataset.i)).catch(() => { b.disabled = false; b.textContent = "declined · try again"; }); });
  card.querySelectorAll(".rbtn").forEach(b => b.onclick = () => { b.disabled = true; (b.dataset.r ? withdraw(+b.dataset.r, "refuse") : refuse(+b.dataset.i)).catch(() => { b.disabled = false; b.textContent = "declined · try again"; }); });
  const pk = card.querySelector(".peek"); if (pk) pk.onclick = () => { showRef = !showRef; render(); };   // unfold or fold the refused cards, page-local
}
function show(i, scroll = true){   // open = card i: its dot and block light up; scroll = bring the block under the map
  const x = dots[i]; open = i;   // seat() parks the block and sets the date exactly; the spy's pixel guess would miss it
  band.querySelectorAll(".dot").forEach(e => e.classList.toggle("on", e.dataset.g ? +e.dataset.g === x.g : +e.dataset.i === i));   // a column member lights alone
  band.querySelectorAll("#arcs path").forEach(e => e.classList.toggle("on", +e.dataset.i === i));
  const art = card.querySelector(`article[data-i="${i}"]`); card.querySelectorAll("article").forEach(e => e.classList.toggle("on", e === art));
  card.querySelectorAll(".row").forEach(e => e.classList.toggle("on", x.tl && e.dataset.d === x.tl));
  if (scroll && art) seat(at(x), art);
}
const tog = d => { unfolded.has(d) ? unfolded.delete(d) : unfolded.add(d); setUrl(); render(); };   // a head clicked: its members pour onto the line or go back in; the line does not move
const go = i => { if (refused.has(dots[i]?.id) && !showRef){ showRef = true; render(); } show(i); };   // aiming at a refused card unfolds the closing line

// ── controls ──
const ntry = document.getElementById("ntry"),
  st = document.getElementById("st"), band = document.getElementById("band"), empty = document.getElementById("empty"),
  card = document.getElementById("card"), mapEl = document.getElementById("top"), lib = document.getElementById("lib"),
  tmine = document.getElementById("tmine"), tfind = document.getElementById("tfind"), pmine = document.getElementById("pmine"), pfind = document.getElementById("pfind"), fres = document.getElementById("fres"), nosign = document.getElementById("nosign");
tmine.onclick = () => { tab = "mine"; library(); }; tfind.onclick = () => { tab = "find"; library(); document.getElementById("q").focus(); };
document.getElementById("q").oninput = () => library(); document.getElementById("sform").onsubmit = e => { e.preventDefault(); library(); };
// wheel over the band: the seat holds, the years stretch or squeeze
const zoom = k => { ppy = Math.max(0.2, Math.min(MAXZ, ppy * k)); fitK = null; draw(); };
const zoomAt = (cx, cy, k) => {   // the date under the pointer stays under the pointer: the seat moves to make it so — the line grows and shrinks around your hand, not around its foot
  const r = band.getBoundingClientRect(), px = (cx - r.left) * Math.cos(TA) - (cy - r.bottom + 14) * Math.sin(TA), tp = (seatD ? Date.parse(seatD) : at(dots[0])) + (px - SEAT) / ppy * YR;   // px along the line from its foot; the foot sits at the band's left edge, 14px up
  zoom(k); seat(tp - (px - SEAT) / ppy * YR); };
band.addEventListener("wheel", e => { e.preventDefault(); if (dots.length) zoomAt(e.clientX, e.clientY, Math.exp(-Math.max(-100, Math.min(100, e.deltaY)) * 0.0022)); }, { passive:false });   // by the wheel's distance: a mouse notch (100) = ×1.25, a trackpad's stream of 4s adds up to the same — per event it ran away, ×8 for a flick
// the seat is a date, exactly: set it, draw it, and scroll the column to its place — between the block before it and the next, by date; blocks, not dots — a refused card or a nested member has no block. The spy re-reads the seat from the scroll only after that lands, since blocks are too short for the round trip to be smooth
let held = false;
const place = (t, a) => {   // where t falls in the column: the block at or before it (a, if given), the next, and how far between
  const arts = [...card.querySelectorAll("article")]; a ??= arts[Math.max(0, arts.findLastIndex(e => at(dots[+e.dataset.i]) <= t))]; const b = arts[arts.indexOf(a) + 1], dj = a && dots[+a.dataset.i], dn = b && dots[+b.dataset.i];
  return a && { a, b, dj, dn, f: b && at(dn) > at(dj) ? Math.min(1, (t - at(dj)) / (at(dn) - at(dj))) : 0 }; };
const park = ({ a, b, f }) => { held = true; const y0 = scrollY; scrollTo(0, scrollY + a.getBoundingClientRect().top + f * (b ? b.getBoundingClientRect().top - a.getBoundingClientRect().top : 0) - PARK()); if (scrollY === y0) held = false; };   // no scroll = no spy pass to clear the flag
function seat(t, a){   // a = the block to park, else the last one at or before t
  const p = place(t, a); if (!p) return; const { b, dj, dn } = p;
  seatD = new Date(Math.max(at(dj), b ? Math.min(t, at(dn)) : at(dj))).toISOString(); draw(); park(p);
}
// the column keeps the line's pace: after each block, room for the gap to the next as the line draws it, so a px of scroll moves the line about a px at any zoom; a screen at most, past that a gap crosses faster
let spK = null;
function space(){
  const k = [ppy, colKey, innerWidth, innerHeight].join("|"); if (ppy == null || k === spK) return; spK = k;
  const arts = [...card.querySelectorAll("article")], top = arts.map(e => e.getBoundingClientRect().top), mb = arts.map(e => parseFloat(e.style.marginBottom) || 0);   // read every block, then write: one layout
  arts.forEach((e, j) => { const n = arts[j + 1]; e.style.marginBottom = n ? Math.round(Math.max(0, Math.min(innerHeight, (at(dots[+n.dataset.i]) - at(dots[+e.dataset.i])) / YR * ppy - (top[j + 1] - top[j] - mb[j])))) + "px" : ""; });
  if (seatD){ const p = place(Date.parse(seatD)); p && park(p); }   // the room moved the blocks: put the seat's date back at the park line
}
// drag the line: the date under the pointer scrolls the column to its place, and the spy seats the line there — scroll and drag are one motion. A drag past 4px swallows the click that ends it, so a dot under the pointer stays closed
let pull = null, pinch = null; const fingers = new Map();   // pull: {x, y, seat, moved}; pinch: the two fingers' last spread; fingers: pointer id → where it is
const spread = () => { const [a, b] = fingers.values(); return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
band.onpointerdown = ev => { if (!dots.length || ev.button) return; fingers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (fingers.size === 2){ pinch = spread(); pull = null; fingers.forEach((_, id) => band.setPointerCapture(id)); return; }   // a second finger turns the drag into a pinch
  pull = { x: ev.clientX, y: ev.clientY, seat: seatD ? Date.parse(seatD) : at(dots[0]), moved: false, id: ev.pointerId }; };   // no capture yet: a capture retargets the click to the band and a dot could never open
band.onpointermove = ev => {
  if (fingers.has(ev.pointerId)) fingers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (pinch && fingers.size === 2){ const s = spread(); if (pinch.d > 0) zoomAt(s.x, s.y, s.d / pinch.d); pinch = s; return; }   // the fingers part, the years stretch between them
  if (!pull || !ev.buttons) return; const d = (ev.clientX - pull.x) * Math.cos(TA) - (ev.clientY - pull.y) * Math.sin(TA);   // px along the line, which rises to the right
  if (!pull.moved && Math.abs(d) < 4) return; if (!pull.moved){ pull.moved = true; band.classList.add("drag"); band.setPointerCapture(pull.id); }
  seat(pull.seat - d / ppy * YR);
};
band.onpointerup = band.onpointercancel = ev => { fingers.delete(ev.pointerId); if (fingers.size < 2) pinch = null; if (!pull) return; swallow = pull.moved; pull = null; band.classList.remove("drag"); };   // the seat stays where the drag left it
let swallow = false; band.addEventListener("click", ev => { if (swallow){ swallow = false; ev.stopPropagation(); } }, true);
// keys anywhere on the page: left/right = next card in date order (on the line or not), up/down = zoom, home/end = first/last card, escape = fit the record from the seat
document.addEventListener("keydown", e => {
  if (e.target.matches("select,input,textarea") || !dots.length || !coord) return;
  const z = { ArrowUp: 1.25, ArrowDown: 0.8 }[e.key], k = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (z) zoom(z); else if (k) go(Math.max(0, Math.min(dots.length - 1, (open ?? -1) + k))); else if (e.key === "Home") go(0); else if (e.key === "End") go(dots.length - 1); else if (e.key === "Escape"){ ppy = null; draw(); } else return;
  e.preventDefault();
});
// scrolling the column: the card at the foot is the seat — its dot sits at the foot, and between two cards the seat's date runs with the scroll, so the line slides as you read and never jumps
const PARK = () => mapEl.offsetHeight + 14;   // where a card's top lands under the stuck map
let sp; addEventListener("scroll", () => { cancelAnimationFrame(sp); sp = requestAnimationFrame(() => {
  if (!card.children.length) return; const park = PARK() + 1, arts = [...card.querySelectorAll("article")]; let k = -1;   // Safari lands a fraction off the park point, so the threshold sits a px past it
  for (const a of arts) if (a.getBoundingClientRect().top <= park) k++; else break;
  const a = arts[Math.max(0, k)], b = arts[k + 1], i = +a.dataset.i, n = b && +b.dataset.i, f = k < 0 || !b ? 0 : Math.max(0, Math.min(1, (PARK() - a.getBoundingClientRect().top) / (b.getBoundingClientRect().top - a.getBoundingClientRect().top)));
  if (dots[i] && !held) seatD = new Date(at(dots[i]) + f * (dots[n] ? at(dots[n]) - at(dots[i]) : 0)).toISOString();
  held = false; if (i !== open) open = i; draw();
}); }, { passive:true });

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (fitK) ppy = null; render(); }, 120); });   // label thinning depends on width; a fit refits to the new line, a hand zoom holds
render();
RELAYS.forEach(u => connect(u));   // not forEach(connect): the index would ride in as the first wait
</script>
