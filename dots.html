<!DOCTYPE html>
<html lang="en">

<!-- No key lives here. The writes are the accept and the refuse (kind 8828, plus the 30829 that
     names your timeline), signed by a NIP-07 extension or a resumed bunker; with the local chip on
     they reach only your add= relay. ws: is here for a relay you run
     yourself (?relay=ws://…); every http(s) channel stays barred. -->

  default-src 'none';
  script-src 'self' 'unsafe-inline';
  worker-src 'self';
  style-src 'unsafe-inline';
  connect-src wss: ws:;
  base-uri 'none';
  form-action 'none'">
<title>Wiki-Timechain · dots</title>
<script>
  // theme before first paint; shares the viewer's choice (wtc:theme = medium | light)

<style>
:root{
  --bg:#0e1014; --panel:#151920; --line:#2a3140;

  --acc:#e0b04a;   /* accepted — the notary's signature */
  --sep:#dcc3a3;   /* summary — warm sepia, apart from the white title and grey content */
  --hz:#e69f00;    /* the horizon marks: where even spacing ends */
  --mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

}
:root[data-theme="light"]{--bg:#f4f3ef;--panel:#ffffff;--line:#d5d2c8;--t0:#1a1c20;--t1:#4c5260;--t2:#6b707c;--sub:#2a63c9;--acc:#9a6a0c;--sep:#7a5a38;--hz:#a85f00}

#top{position:sticky;top:0;z-index:2;background:var(--bg);min-width:0}   /* header and band stay while the column scrolls under them; min-width:0 = a long header line cannot widen the grid item and shove the band */

.tick::before{content:"";position:absolute;bottom:-14px;left:50%;height:3px;width:1px;background:var(--t2)}

.dot::before{content:"";position:absolute;inset:-10px}   /* the finger gets 31px, the eye keeps the dot */
.dot.acc{border-color:var(--acc)}
.dot.many{opacity:1;background:var(--sub);color:#000;font:bold 10px var(--mono)} .dot.many.acc{background:var(--acc)}   /* the count sits inside once the dot is big enough */

.nib{position:absolute;width:1px;background:var(--t2);transform:translate(-50%,-50%);pointer-events:none}   /* a moment: cards no zoom can part stand on a stem off their side of the line */
#line .mo{position:absolute;font:bold 11px var(--mono);color:var(--t1);transform-origin:0 0;transform:rotate(var(--ta)) translate(-50%,-100%);white-space:nowrap;pointer-events:none}   /* the moment's date, flat, centred over its column */
.dot.tl{border:0;border-radius:0;background:none;opacity:1;isolation:isolate;box-sizing:border-box;display:flex;justify-content:center;align-items:flex-end;padding:0 0 2px;color:#000;font:bold 10px var(--mono);transform:translate(-50%,-100%)} .dot.tl.sub{transform:translate(-50%,0);align-items:flex-start;padding:2px 0 0} .dot.tl b{transform:rotate(var(--ta))}   /* a head turns with the line, base on its point: accepted stands above, submitted hangs below; only its count turns back flat */
.dot.tl::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--sub);clip-path:polygon(50% 0,100% 100%,0 100%)} .dot.tl.sub::after{clip-path:polygon(0 0,100% 0,50% 100%)} .dot.tl.acc::after{background:var(--acc)} .dot.tl.unfolded::before{content:"";position:absolute;inset:5px 4px 3px;z-index:0;background:var(--bg);clip-path:polygon(50% 0,100% 100%,0 100%)} .dot.tl.sub.unfolded::before{inset:3px 4px 5px;clip-path:polygon(0 0,100% 0,50% 100%)} .dot.tl.unfolded b{display:none}   /* timeline: a triangle, its base on the line; unfolded = hollow, its members are out on the line */
.dot.tw,.dot.tw.sub{align-items:center;padding:0} .dot.tw::after,.dot.tw.sub::after{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .dot.tw.unfolded::before,.dot.tw.sub.unfolded::before{inset:4px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}   /* timetree: a diamond, its tip on the point */
.dot.tl.on,.dot.tl:hover,.dot.tl:focus-visible{outline:0;box-shadow:0 3px 0 -1px var(--t0)} .dot.tl.sub.on,.dot.tl.sub:hover,.dot.tl.sub:focus-visible{box-shadow:0 -3px 0 -1px var(--t0)}   /* the open head is underlined along its rule */
.bar i{position:absolute;top:-3.75px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor} .bar i.t{top:-4.75px;width:8px;height:8px;margin-left:-4px;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}   /* a timeline's rule carries a bead per thing it holds, at its date: a dot per card, a small triangle per timeline */
.bar{position:absolute;height:0;border-top:1.5px solid;color:var(--sub);opacity:.6;transform-origin:0 0;transform:rotate(var(--ta));pointer-events:none} .bar.acc{color:var(--acc)} .bar.ref{opacity:.2} .bar.on{opacity:1}   /* a card's span: a flat rule from its dot to under its end date, above the title; every date has its own height on the line, so rules never share one */
.bar.end::after{content:"";position:absolute;right:0;top:-4px;height:8px;border-right:2px solid}   /* the end says where it stops — only a true end; a span cut by the line's top runs off it bare */
#empty{position:absolute;left:0;right:0;top:48px;text-align:center;color:var(--t2)}
/* the line IS the column — it rises 22° from the foot; the seat is its middle, the open card hangs under it, the whole record rides the line out to both ends */
#line{position:absolute;left:0;height:0;border-top:1px solid var(--t2);transform-origin:0 0;transform:rotate(calc(-1 * var(--ta)))}   /* years above the line, titles below: two planes, nothing crosses */
#line .yrs{position:absolute;left:0;top:-3.5px;overflow:visible;pointer-events:none} #line .yrs path{stroke:var(--t2);fill:none;opacity:.45}   /* a faint mark per year: where they crowd, the line is squeezed */
.phone .tick{top:14px;transform:translateX(-50%) rotate(var(--ta))} .phone .tick::before{display:none}   /* a steep line: years flat, on the lower-right side; the upper-left, where the record crowds, is the titles' room */
.tick.hz::before{background:var(--hz);width:2px;height:7px;bottom:-16px} .phone .tick.hz{top:-4px;height:7px;font-size:0} .phone .tick.hz::before{display:block;bottom:0}   /* where even spacing ends: a mark on the line, no word */
#line .seat{position:absolute;top:0;width:18px;height:18px;border:2px solid var(--t1);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}   /* the seat: mid-line */
#drop{position:absolute;bottom:0;width:0;border-left:1px dashed var(--t2);pointer-events:none}   /* from the seat down to the card that hangs under it */
#leads{position:absolute;left:0;top:0;overflow:visible;pointer-events:none} #leads path{stroke:var(--t2);fill:none;opacity:.7}   /* a title set a row out keeps a faint leader to its dot */
#line .ttl{position:absolute;font-size:13px;transform-origin:0 0;transform:rotate(var(--ta));white-space:nowrap;line-height:15px;color:var(--t1);pointer-events:none} #line .ttl.alt{color:var(--sep)} #line .ttl i{color:var(--t2);font-style:normal}   /* every other title warm: the eye keeps its row */   /* a title rides its dot, turned back flat, one size, whole or not at all */


#card{max-width:68ch;align-self:start;margin:14px 0 24px;display:grid;gap:14px;overflow-anchor:none}   /* every card, in date order; the one nearest the top is open; the seat keeps the scroll, not the browser */
#card::after{content:"";height:100vh}   /* room for the last card to reach the foot */
#card:empty{display:none}
#card{margin-left:var(--seat,46px)} #card .c+.c{border-top:1px solid var(--t2);padding-top:14px}   /* the column hangs centred under the seat, as far as the window lets it; the top card is the line's bottom node; every card at full ink, the darkest rule on the page parts one card from the next */
.c.ref{opacity:.6} #card .refs{margin-top:16px;font-size:12px;color:var(--t2);border-top:1px solid var(--line);padding-top:6px}   /* refused: one closing line, the cards behind it on request */
#card h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--t0);text-wrap:balance}
#card h2{font-family:var(--sans);font-size:18px;line-height:1.3;letter-spacing:-.01em}
#card .when{font-size:13px;color:var(--t1);margin-bottom:2px} #card .when i{color:var(--t2);font-style:normal}   /* the event's own axis: when, then what */
#card .a{color:var(--acc)} .actions .a{border:1px solid var(--acc);padding:0 6px}   /* the ✓ N pill */
#card .abtn{border:1px dashed var(--acc);color:var(--acc);padding:0 6px} #card .abtn:disabled{opacity:.5;cursor:default}
#card .rbtn{border:1px dashed var(--t2);color:var(--t2);padding:0 6px} #card .rbtn:disabled{opacity:.5;cursor:default}   /* refuse / restore: the grey twin of the accept pill */   /* the same pill, dashed = not yet: press it and it fills */
#card .rec,#card .actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--t2)}   /* two rules below the fact: the record (who wrote it, its json), then your act on it */
#card .rec b{font-weight:400;color:var(--t1)} #card .rec .rawbtn{margin-left:auto;color:var(--t2)} #card pre.raw{margin:6px 0 0;font-size:11px;line-height:1.4;color:var(--t2);white-space:pre-wrap;word-break:break-all}
#card .actions button{padding:2px 8px;border-radius:4px}
#card .sum{color:var(--sep);margin:0 0 12px;font:500 14px/1.5 var(--sans)}   /* summary = the plain fact, full size, sepia */
#card p{margin:0 0 10px;color:var(--t1);font:14px/1.6 var(--sans)}   /* prose is for reading; the surrounding record and provenance stay mono */
#card .vers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
#card .vers button{border:1px dashed var(--line);padding:1px 8px;font-size:12px;color:var(--t1)}
#card .vers button.on{border-style:solid;border-color:var(--t1)}
#card .day{margin:0 0 4px;padding-top:14px;border-top:1px solid var(--t2);font-size:12px;color:var(--t2);border-bottom:1px solid var(--line)} #card .day:first-child{padding-top:0;border-top:0}   /* a new day: its line takes the card rule's place */
.c.tl h2{margin:0;display:flex;gap:12px;align-items:baseline} .c.tl .go{color:var(--t0);text-align:left} .c.tl .n{margin-left:auto;font-size:12px;font-weight:400;color:var(--t2);white-space:nowrap} .c.tl .sum{margin:4px 0 0} .c.tl .drop{color:var(--t2);font-size:12px} .c.tl .fold{color:var(--t2);width:14px;text-align:left} .c.tl .drop[data-arm]{color:var(--acc)} .c.tl .row.on > h2 .go{color:var(--acc)}   /* a timeline row: title (the door), count, its summary — the menu, and a source inside a timeline */

@media (max-width:640px){ header{gap:10px} header .st{margin-left:0}
  header:has(.prow){padding-block:4px 2px} header:has(.prow) .ntry{flex-basis:100%} header:has(.prow):not(.more) .st{display:none}   /* a phone's timeline header: one row; ⋯ brings the rest */
  .prow{display:flex;align-items:center;gap:10px;min-height:44px} .ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t0)}
  .prow #back{flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:9px;padding:6px 10px;color:var(--t1)}
  .prow #morebtn{flex:none;width:44px;height:44px;font-size:20px;color:var(--t1)} .prow #morebtn[aria-expanded="true"]{color:var(--t0)}
  .pmore{padding-block:4px} }
[hidden]{display:none!important}
/* the Library header; the list itself is lib/library.mjs */

</style>

<body>

<main>
  <div id="top">
    <header>
      <span class="ntry" id="ntry"></span>
      <span class="st nav"><a id="towiki" href="./">cardex</a> · <a id="toadd" href="add.html">add</a></span><span class="st" id="bst"></span><span class="st" id="st">connecting…</span>
    </header>
    <div id="band" aria-label="timeline, one dot per card"><div id="empty" hidden>no cards yet</div><i id="drop"></i></div>
  </div>
  <section id="card" aria-label="the cards, in date order"></section>
  <section id="lib" aria-label="Library" hidden></section>
</main>

<script type="module">
import { fold8828 } from "./lib/fold-8828.mjs";
import { mountLibrary } from "./lib/library.mjs";
import { pull as pullFrom, route, busy, T0 } from "./lib/pull.mjs";
import { dotsOf, byDate, timeMin, sourcesOf, sourceSubjects } from "./lib/dots-derive.mjs?v=5";   /* bump when the lib changes shape: a cached old copy kills the page at import */

const Q = new URLSearchParams(location.search);
const HOME = /^(127\.0\.0\.1|localhost|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$/.test(location.hostname);   // the page served from this machine or its LAN: the local copy
const ADD = Q.get("add") ?? (HOME && !Q.get("relay") ? "ws://127.0.0.1:7777" : ""), LOCAL0 = HOME && !!ADD;   // the local copy brings the lab relay and opens on the local side; add= (even empty) says otherwise
const MAIN = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.ditto.pub",
  "wss://offchain.pub", "wss://nostr.mom", "wss://relay.nostr.net"];
const RELAYS = (Q.get("relay") ? Q.get("relay").split(",") : [...MAIN, ...(ADD || "").split(",").filter(Boolean)]).map(u => /^(127\.0\.0\.1|localhost)$/.test(location.hostname) ? u : u.replace(/127\.0\.0\.1|localhost/, location.hostname));   // relay= replaces the network, add= joins it; a loopback relay follows the page's host, so one URL serves the Mac and the iPad
const KIND = 30828, ACT_KIND = 8828, NOTARY_KIND = 30829, MARKER = "wikitimechain";

// ── state ──
const notaries = new Map();   // coord → newest 30829
const cards = new Map();      // pubkey:d → newest 30828
const acts = new Map();       // id → 8828 (only if the act AND its snapshot verified)
const actE = new Set();       // act ids we hold — a revoke carries no `a`, so it is fetched by #e
const profiles = new Map();   // pubkey → name
const vOK = new Set(), vBad = new Set(), sockets = [];
let trail = (Q.get("p") || "").split(",").filter(Boolean);   // trail: the timetrees walked through to get here, oldest first
let cardW = null, spotOf = new Map(), fitted = null, want = Q.get("c"), coord = null, askT = null, open = null, dots = [], renderT = null, colKey = null;
let me = Q.get("me") === "1", local = Q.has("local") ? Q.get("local") === "1" : LOCAL0, names = false, unfolded = new Set((Q.get("u") || "").split(",").filter(Boolean)), refused = new Map(), showRef = false, raw = new Set();   // unfolded: timelines whose members ride this view — on the line and in the column
let TA = 22 * Math.PI / 180; const NEAR = 0.5, PAD = 12, YR = 864e5 * 365.25, ROW = 17; let ppy = null, seatD = null;   // ROW = one title row on the screen, px; seat = the open card's date, mid-line; NEAR = the part of each half-line spaced evenly, ppy px per year there; PAD keeps the end dots off the band's edge
let myPk = null; try { myPk = localStorage.getItem("wtc:pk") || JSON.parse(localStorage.getItem("wtc:signin") || "{}").pk || null; } catch {}
const NOW = new Date().toISOString().slice(0, 10);

// ── the gate: every event is id-hashed and signature-checked before it counts — in a pool of workers, so the page never waits on the math ──
const pend = new Map();   // id → { ev, fns } out for verify; a copy from another relay joins the wait instead of being checked again
const pool = Array.from({ length: Math.min(8, navigator.hardwareConcurrency || 2) }, () => {
  const w = new Worker("./lib/verify-worker.mjs", { type:"module" }); w.onmessage = ({ data:[id, ok] }) => settle(id, ok); return w; });
let rr = 0;
const seenOn = new Map();   // id → Set(relay url): a card no MAIN relay has echoed is "local" — still on this machine
const isLocal = id => ![...(seenOn.get(id) || [])].some(u => MAIN.includes(u));
const onSide = id => local ? [...(seenOn.get(id) || [])].some(u => !MAIN.includes(u)) : !isLocal(id);   // local = everything your relay has, sent or not; nostr = what a MAIN relay echoed
function admit(ev, fn, url){
  if (!ev || !/^[0-9a-f]{64}$/.test(String(ev.id)) || vBad.has(ev.id)) return;
  const s = seenOn.get(ev.id) || seenOn.set(ev.id, new Set()).get(ev.id); if (ADD && !s.has(url) && MAIN.includes(url)) schedule(); s.add(url);   // a main echo moves a card from the local side to the nostr side
  if (vOK.has(ev.id)) return fn(ev);
  const p = pend.get(ev.id); if (p) return p.fns.push(fn);
  pend.set(ev.id, { ev, fns:[fn] }); pool[rr++ % pool.length].postMessage([ev.id, ev]);
}
function settle(id, ok){
  const { ev, fns } = pend.get(id); pend.delete(id);
  if (ok){ vOK.add(id); fns.forEach(fn => fn(ev)); } else { vBad.add(id); console.warn("dots: dropped", id); schedule(); }
}

// ── ingest ──
const tag = (ev, n) => (ev.tags.find(t => t[0] === n) || [])[1] || "";
const gone = new Map();   // what a kind 5 took back: id → its author, or kind:pk:d → as of when; a copy arriving later from another relay stays out
const isGone = ev => gone.get(ev.id) === ev.pubkey || (gone.get(ev.kind + ":" + ev.pubkey + ":" + tag(ev, "d")) ?? -1) >= ev.created_at;
function ingestDelete(ev){   // NIP-09: only the author can take a record back; a coord takes every version up to the delete's own time
  for (const [n, v] of ev.tags){
    if (n === "e" && v) gone.set(v, ev.pubkey);
    if (n === "a" && v && v.split(":")[1] === ev.pubkey) gone.set(v, Math.max(gone.get(v) ?? -1, ev.created_at)); }
  for (const m of [notaries, cards, acts]) for (const [k, e] of m) if (isGone(e)) m.delete(k);
  schedule();
}
function ingestNotary(ev){
  const d = tag(ev, "d"); if (!d || isGone(ev)) return;
  const c = NOTARY_KIND + ":" + ev.pubkey + ":" + d, cur = notaries.get(c);
  if (cur && cur.created_at >= ev.created_at) return;
  notaries.set(c, ev);
  if (!coord && want === d) choose(d, trail);
  clearTimeout(askT); askT = setTimeout(ask, 300); schedule();
}
function ingestCard(ev){
  const d = tag(ev, "d"); if (!d || isGone(ev)) return;
  const k = ev.pubkey + ":" + d, cur = cards.get(k);
  if (cur && cur.created_at >= ev.created_at) return;
  cards.set(k, ev); askProfile(ev.pubkey); if (!askedDel.includes(ev.pubkey)){ clearTimeout(askT); askT = setTimeout(ask, 300); } schedule();
}
function ingestAct(ev){
  if (acts.has(ev.id) || isGone(ev)) return;
  const keep = () => { acts.set(ev.id, ev); if (!actE.has(ev.id)){ actE.add(ev.id); clearTimeout(askT); askT = setTimeout(ask, 300); } schedule(); };
  let snap = null; try { snap = JSON.parse(tag(ev, "snapshot") || "null"); } catch {}
  // the act's signature cannot vouch for the card it carries — that snapshot walks the gate too
  snap && snap.id ? admit(snap, s => { askProfile(s.pubkey); keep(); }) : keep();
}
function ingestProfile(ev){
  let name = ""; try { const p = JSON.parse(ev.content); name = p.display_name || p.name || ""; } catch {}

  if (e.target.matches("select,input,textarea") || !dots.length || !coord) return;
  const z = { ArrowUp: 1.25, ArrowDown: 0.8 }[e.key], k = { ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (z) zoom(z); else if (k) go(Math.max(0, Math.min(dots.length - 1, (open ?? -1) + k))); else if (e.key === "Home") go(0); else if (e.key === "End") go(dots.length - 1); else if (e.key === "Escape"){ ppy = null; draw(); } else return;
  e.preventDefault();
});
// scrolling the column: the card at the foot is the seat — its dot sits at the foot, and between two cards the seat's date runs with the scroll, so the line slides as you read and never jumps
const PARK = () => mapEl.offsetHeight + 14;   // where a card's top lands under the stuck map
let sp; addEventListener("scroll", () => { cancelAnimationFrame(sp); sp = requestAnimationFrame(() => {
  if (!card.children.length || card.hidden) return; const park = PARK() + 1, arts = [...card.querySelectorAll("article")]; let k = -1;   // hidden (exploring): every top reads 0 and the seat would jump to the last card. Safari lands a fraction off the park point, so the threshold sits a px past it
  for (const a of arts) if (a.getBoundingClientRect().top <= park) k++; else break;
  const a = arts[Math.max(0, k)], b = arts[k + 1], i = +a.dataset.i, n = b && +b.dataset.i, f = k < 0 || !b ? 0 : Math.max(0, Math.min(1, (PARK() - a.getBoundingClientRect().top) / (b.getBoundingClientRect().top - a.getBoundingClientRect().top)));
  if (dots[i] && !held && bandH == null) seatD = new Date(at(dots[i]) + f * (dots[n] ? at(dots[n]) - at(dots[i]) : 0)).toISOString();
  held = false; if (i !== open) open = i; draw();
}); }, { passive:true });

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });   // label thinning depends on width
render();
RELAYS.forEach(u => connect(u));   // not forEach(connect): the index would ride in as the first wait
[5100, 10100].forEach(t => setTimeout(schedule, t));   // when loading() stops waiting on relays that never opened
</script>
