<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Reader only: no key, no write, nothing leaves but relay subscriptions. ws: is here for
     the lab relay (?relay=ws://127.0.0.1:7777); every http(s) channel stays barred. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  worker-src 'self';
  style-src 'unsafe-inline';
  connect-src wss: ws://127.0.0.1:7777;
  base-uri 'none';
  form-action 'none'">
<title>Wiki-Timechain · dots</title>
<script>
  // theme before first paint; shares the viewer's choice (wtc:theme = medium | light)
  try { const t = localStorage.getItem("wtc:theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch {}
</script>
<style>
:root{
  --bg:#0e1014; --panel:#151920; --line:#2a3140;
  --t0:#e6e9ef; --t1:#9aa3b2; --t2:#7b8596;
  --sub:#6ea8fe;   /* submitted — the author's signature */
  --acc:#e0b04a;   /* accepted — the notary's signature */
  --sep:#dcc3a3;   /* summary — warm sepia, apart from the white title and grey content */
  --mono:ui-monospace,Menlo,Consolas,"DejaVu Sans Mono",monospace;
}
:root[data-theme="light"]{--bg:#f4f3ef;--panel:#ffffff;--line:#d5d2c8;--t0:#1a1c20;--t1:#4c5260;--t2:#6b707c;--sub:#2a63c9;--acc:#9a6a0c;--sep:#7a5a38}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font:14px/1.5 var(--mono);min-height:100vh;
  display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(0,1fr);padding-inline:16px}
a{color:var(--sub)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
del{color:var(--t2)} ins{text-decoration:none;color:var(--t0)}
.lhost{color:var(--t2);font-size:12px}
.lhost::before{content:" ⟨"} .lhost::after{content:"⟩"}

header{display:flex;gap:18px;align-items:baseline;padding-block:12px 6px;flex-wrap:wrap;max-width:1100px;width:100%;margin:0 auto}
header .ntry{color:var(--t2)} header .a{color:var(--acc)} header .ntry b{color:var(--acc);font-weight:400} header .ntry button{color:var(--t1)}
header .st{margin-left:auto;color:var(--t2);font-size:12px}

main{display:grid;grid-template-rows:auto 1fr;max-width:1100px;width:100%;margin:0 auto}
#top{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:10px}   /* header, band, scrub and ledger stay while the column scrolls under them */
#band{position:relative;height:146px;user-select:none}
#axis{position:absolute;left:0;right:0;top:78px;height:1px;background:var(--t2)}
#now{position:absolute;top:64px;height:30px;width:0;border-left:1px dashed var(--t1)}
#now i{position:absolute;top:100%;left:4px;font-size:11px;font-style:normal;color:var(--t1)}
.tick{position:absolute;top:118px;font-size:11px;color:var(--t2);transform:translateX(-50%);white-space:nowrap}
.tick::before{content:"";position:absolute;top:-40px;left:50%;height:3px;width:1px;background:var(--t2)}
.dot{position:absolute;width:var(--dot,11px);height:var(--dot,11px);border-radius:50%;transform:translate(-50%,-50%);
  border:1.5px solid var(--sub);background:transparent}
.dot::before{content:"";position:absolute;inset:-10px}   /* the finger gets 31px, the eye keeps the dot */
.dot[data-n]::after{content:"+" attr(data-n);position:absolute;left:50%;bottom:100%;transform:translate(-50%,-4px);font-size:11px;color:var(--t1)}   /* above, so dense neighbours never cover it */
.dot.sub{background:var(--sub)}
.dot.acc{border-color:var(--acc);background:var(--acc)}
.dot.future{background:transparent}
.dot:hover,.dot.on,.dot:focus-visible{outline:2px solid var(--t0);outline-offset:2px}
.tie{position:absolute;width:1px;background:var(--line);transform:translateX(-50%)}
.tail{position:absolute;height:3px;background:var(--line);transform:translateY(-50%)}   /* a timeline's reach, first card to last */
#empty{position:absolute;left:0;right:0;top:48px;text-align:center;color:var(--t2)}

#ledger{height:22px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ledger b{color:var(--t0);font-weight:400}
#ledger .a{color:var(--acc)} #ledger .s{color:var(--sub)} #ledger .t2{color:var(--t2)}

#card{max-width:68ch;align-self:start;margin:14px 0 24px;display:grid;gap:14px}   /* every card, in date order; the one nearest the top is open */
#card::after{content:"";height:60vh}   /* room for the last card to reach the top */
#card:empty{display:none}
.c{padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sub)}
.c.acc{border-left-color:var(--acc)} .c.on{box-shadow:0 0 0 1px var(--t1)}
#card h2{margin:0 0 2px;font-size:17px;font-weight:600;color:var(--t0);text-wrap:balance}
#card .meta{color:var(--t2);font-size:12px;margin-bottom:10px} #card .meta b{font-weight:400;color:var(--t1)}
#card .a{color:var(--acc)} .meta .a{border:1px solid var(--acc);padding:0 6px}   /* the ✓ N pill */
#card .sum{color:var(--sep);margin:0 0 12px}   /* summary = the plain fact, full size, sepia */
#card p{margin:0 0 10px;color:var(--t1);font-size:13px}   /* content = the detail, a step smaller and dimmer */
#card .vers{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
#card .vers button{border:1px dashed var(--line);padding:1px 8px;font-size:12px;color:var(--t1)}
#card .vers button.on{border-style:solid;border-color:var(--t1)}
#card .day{margin:16px 0 4px;font-size:12px;color:var(--t2);border-bottom:1px solid var(--line)} #card .day:first-child{margin-top:0}
#card .foot{margin-top:12px;font-size:12px;color:var(--t2)} #card .foot a{color:var(--t2)}
#card .tl{margin:-14px -16px 14px;padding:12px 16px;border-bottom:1px solid var(--line)} #card .tl .meta{margin:0}
#card .go{margin-top:8px;border:1px solid var(--t1);padding:2px 10px;color:var(--t0)}

#scrub{position:relative;height:34px;margin-bottom:10px;border-top:1px solid var(--line);cursor:pointer;touch-action:none;user-select:none}
#scrub:focus-visible{outline:none;border-top-color:var(--t0)}
#scrub .d{position:absolute;top:5px;width:5px;height:5px;border-radius:50%;background:var(--sub);transform:translateX(-50%)}
#scrub .d.acc{background:var(--acc)} #scrub .d.future{background:transparent;border:1px solid var(--sub)}
#scrub .win{position:absolute;top:4px;bottom:0;min-width:6px;border:1px solid var(--t0);border-bottom:none;background:color-mix(in srgb,var(--t1) 16%,transparent);cursor:grab}
#scrub .h{position:absolute;top:-1px;bottom:0;width:9px;cursor:ew-resize} #scrub .h.l{left:-5px} #scrub .h.r{right:-5px}
#scrub .h::after{content:"";position:absolute;left:3px;top:9px;bottom:6px;width:3px;background:var(--t0)}   /* handles you can see */
#scrub .now{position:absolute;top:2px;bottom:0;border-left:1px dashed var(--t2);pointer-events:none}
#scrub .ed{position:absolute;top:15px;font-size:13px;color:var(--t1);pointer-events:none;white-space:nowrap;padding:0 5px}
#scrub .ed.l{transform:translateX(-100%)} #scrub .ed.in.l{transform:none} #scrub .ed.in.r{transform:translateX(-100%)}

@media (max-width:640px){ header{gap:10px} header .st{margin-left:0} }
</style>
</head>
<body>

<main>
  <div id="top">
    <header>
      <span class="ntry" id="ntry"></span>
      <span class="st" id="st">connecting…</span>
    </header>
    <div id="band" aria-label="timeline, one dot per card"><div id="axis"></div><div id="empty" hidden>no cards yet</div></div>
    <div id="scrub" tabindex="0" aria-label="whole record: arrows move, up and down zoom, home and end jump, escape shows everything"></div>
    <div id="ledger">&nbsp;</div>
  </div>
  <section id="card" aria-label="the cards, in date order"></section>
</main>

<script type="module">
import { fold8828 } from "./lib/fold-8828.mjs";
import { dotsOf, byDate } from "./lib/dots-derive.mjs";

const Q = new URLSearchParams(location.search);
const MAIN = ["wss://relay.damus.io", "wss://nos.lol", "wss://relay.primal.net", "wss://relay.mostr.pub",
  "wss://relay.nostr.band", "wss://offchain.pub", "wss://nostr.mom"];
const RELAYS = Q.get("relay") ? Q.get("relay").split(",") : [...MAIN, ...(Q.get("add") || "").split(",").filter(Boolean)];   // relay= replaces the network, add= joins it
const KIND = 30828, ACT_KIND = 8828, NOTARY_KIND = 30829, MARKER = "wikitimechain";

// ── state ──
const notaries = new Map();   // coord → newest 30829
const cards = new Map();      // pubkey:d → newest 30828
const acts = new Map();       // id → 8828 (only if the act AND its snapshot verified)
const actE = new Set();       // act ids we hold — a revoke carries no `a`, so it is fetched by #e
const profiles = new Map();   // pubkey → name
const vOK = new Set(), vBad = new Set(), sockets = [];
let want = Q.get("c"), coord = null, askT = null, win = spanOf(Q.get("y")), open = null, dots = [], renderT = null, colKey = null;
let myPk = null; try { myPk = localStorage.getItem("wtc:pk") || JSON.parse(localStorage.getItem("wtc:signin") || "{}").pk || null; } catch {}
const NOW = new Date().toISOString().slice(0, 10);

// ── the gate: every event is id-hashed and signature-checked before it counts — in a pool of workers, so the page never waits on the math ──
const pend = new Map();   // id → { ev, fns } out for verify; a copy from another relay joins the wait instead of being checked again
const pool = Array.from({ length: Math.min(8, navigator.hardwareConcurrency || 2) }, () => {
  const w = new Worker("./lib/verify-worker.mjs", { type:"module" }); w.onmessage = ({ data:[id, ok] }) => settle(id, ok); return w; });
let rr = 0;
function admit(ev, fn){
  if (!ev || !/^[0-9a-f]{64}$/.test(String(ev.id)) || vBad.has(ev.id)) return;
  if (vOK.has(ev.id)) return fn(ev);
  const p = pend.get(ev.id); if (p) return p.fns.push(fn);
  pend.set(ev.id, { ev, fns:[fn] }); pool[rr++ % pool.length].postMessage([ev.id, ev]);
}
function settle(id, ok){
  const { ev, fns } = pend.get(id); pend.delete(id);
  if (ok){ vOK.add(id); fns.forEach(fn => fn(ev)); } else { vBad.add(id); console.warn("dots: dropped", id); }
}

// ── ingest ──
const tag = (ev, n) => (ev.tags.find(t => t[0] === n) || [])[1] || "";
function ingestNotary(ev){
  const d = tag(ev, "d"); if (!d) return;
  const c = NOTARY_KIND + ":" + ev.pubkey + ":" + d, cur = notaries.get(c);
  if (cur && cur.created_at >= ev.created_at) return;
  notaries.set(c, ev);
  if (!coord && want === d) choose(d);
  clearTimeout(askT); askT = setTimeout(ask, 300); schedule();
}
function ingestCard(ev){
  const d = tag(ev, "d"); if (!d) return;
  const k = ev.pubkey + ":" + d, cur = cards.get(k);
  if (cur && cur.created_at >= ev.created_at) return;
  cards.set(k, ev); askProfile(ev.pubkey); schedule();
}
function ingestAct(ev){
  if (acts.has(ev.id)) return;
  const keep = () => { acts.set(ev.id, ev); if (!actE.has(ev.id)){ actE.add(ev.id); clearTimeout(askT); askT = setTimeout(ask, 300); } schedule(); };
  let snap = null; try { snap = JSON.parse(tag(ev, "snapshot") || "null"); } catch {}
  // the act's signature cannot vouch for the card it carries — that snapshot walks the gate too
  snap && snap.id ? admit(snap, s => { askProfile(s.pubkey); keep(); }) : keep();
}
function ingestProfile(ev){
  let name = ""; try { const p = JSON.parse(ev.content); name = p.display_name || p.name || ""; } catch {}
  profiles.set(ev.pubkey, name.trim()); schedule();
}
const who = pk => profiles.get(pk) || pk.slice(0, 8);
let profT = null; const wantProf = new Set();
function askProfile(pk){
  if (profiles.has(pk) || wantProf.has(pk)) return;
  wantProf.add(pk);
  if (profT) return;
  profT = setTimeout(() => { profT = null;
    send(["REQ", "prof", { kinds:[0], authors:[...wantProf].filter(p => !profiles.has(p)) }]); }, 300);
}

// ── relays ──
const send = m => sockets.forEach(ws => ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify(m)));
let asked = "";
function ask(){   // one sub over every timeline known so far; same sub id = the relay swaps the filter AND replays it, so re-send only what grew
  const cs = [...notaries.keys()]; if (!cs.length) return;
  if (asked !== cs.join()){ asked = cs.join(); send(["REQ", "wtc", { kinds:[KIND], "#a":cs }]); }
  send(["REQ", "act", { kinds:[ACT_KIND], "#a":cs }, ...(actE.size ? [{ kinds:[ACT_KIND], "#e":[...actE] }] : [])]);
}
let up = 0;
function connect(url){
  let ws; try { ws = new WebSocket(url); } catch { return; }
  sockets.push(ws);
  ws.onopen = () => { up++; status(); ws.send(JSON.stringify(["REQ", "ntry", { kinds:[NOTARY_KIND], "#t":[MARKER] }])); asked = ""; ask(); };   // a late relay has heard nothing yet
  ws.onmessage = m => {
    let d; try { d = JSON.parse(m.data); } catch { return; }
    if (d[0] !== "EVENT") return;
    if (d[1] === "ntry") admit(d[2], ingestNotary);
    if (d[1] === "wtc")  admit(d[2], ingestCard);
    if (d[1] === "act")  admit(d[2], ingestAct);
    if (d[1] === "prof") admit(d[2], ingestProfile);
  };
  ws.onclose = ws.onerror = () => status();
}
const status = () => { st.textContent = `${sockets.filter(w => w.readyState === WebSocket.OPEN).length}/${RELAYS.length} relays`; };

// a timeline is its subject `d`, whole — every notary that carries that d pours its dots in, then ONE dot per card:
// gold if any notary accepted it, blue otherwise; `accs` = the notaries that did (the ✓ N pill), so the band never repeats a card
const notariesOf = d => [...notaries.entries()].filter(([c]) => c.split(":").slice(2).join(":") === d);
function dotsFor(d, projections, all){
  const byId = new Map();
  for (const [c] of notariesOf(d)) for (const x of dotsOf(c, projections, all)){
    const cur = byId.get(x.id) || byId.set(x.id, { ...x, kind:"sub", accs:[] }).get(x.id);
    if (x.kind === "acc"){ cur.accs.push(c); Object.assign(cur, x, { kind:"acc", accs:cur.accs }); }   // an accepted projection carries the notary's selected fields
  }
  return [...byId.values()].sort(byDate);
}
const titleOf = d => notariesOf(d).map(([, n]) => tag(n, "title")).find(Boolean) || d;
function choose(c){   // c = a subject d → that timeline; null → the timeline of timelines
  coord = c; open = null; want = null; win = c ? spanOf(Q.get("y")) : null; card.innerHTML = ""; colKey = null; scrollTo(0, 0);
  const q = new URLSearchParams(); if (c) q.set("c", c);
  for (const k of ["relay", "add"]) if (Q.get(k)) q.set(k, Q.get(k));
  history.replaceState(null, "", "?" + q); schedule();
}

// ── derive + render ──
function schedule(){ if (!renderT) renderT = setTimeout(() => { renderT = null; render(); }, 120); }
const esc = s => String(s ?? "").replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2064\u2066-\u2069\uFEFF]/g, "")
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
function host(url, label){
  let h; try { h = new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; }
  return !h || label.toLowerCase().includes(h.toLowerCase()) ? "" : `<span class="lhost">${esc(h)}</span>`;
}
// paragraphs, [label](url) with its host printed, {-del-}/{+ins+} marks — what the cards use
const prose = t => esc(t).split(/\n\s*\n/).map(b => "<p>" + b.trim()
  .replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g, (_, l, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${l}</a>` + host(u, l))
  .replace(/\{-([^]*?)-\}/g, "<del>$1</del>").replace(/\{\+([^]*?)\+\}/g, "<ins>$1</ins>")
  .replace(/\n/g, "<br>") + "</p>").join("");

const T = d => Date.parse(d.slice(0, 10) + "T12:00:00Z");
const frac = (t, a, b) => (t - a) / (b - a);
const MON = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const isMine = x => myPk && x.author === myPk;
const accsOf = id => dots.find(o => o.id === id)?.accs || [];   // the notaries that accepted this exact card
const mark = n => n ? `<span class="a">✓ ${n}</span>` : "";   // ✓ N = accepted by N notaries; the pill is a dead end for now, on purpose

function spanOf(z){                        // "YYYY" or "YYYY-MM" → [from, to) ms; anything else → null (whole record)
  if (z && /^\d{4}-\d{2}$/.test(z)){ const [y, m] = z.split("-").map(Number); return [Date.UTC(y, m - 1, 1), Date.UTC(y, m, 1)]; }
  if (z && /^\d{4}$/.test(z)){ const y = +z; return [Date.UTC(y, 0, 1), Date.UTC(y + 1, 0, 1)]; }
  return null;
}
function windowOf(whole){                  // win: null = whole record, else any [from, to) the user dragged; whole=true ignores win
  if (win && !whole) return win;
  const ts = dots.map(x => T(x.date)); if (!ts.length) return [Date.UTC(2026,0,1), Date.UTC(2027,0,1)];
  const a = Math.min(...ts), b = Math.max(...ts), pad = Math.max((b - a) * 0.04, 864e5 * 15);
  return [a - pad, b + pad];
}

function render(){
  const fold = fold8828([...acts.values()], { verifyEvent: e => vOK.has(e.id) }), all = [...cards.values()];
  if (coord){
    dots = dotsFor(coord, fold.projections, all);
    const ns = notariesOf(coord), nAcc = dots.filter(x => x.kind === "acc").length;
    ntry.innerHTML = `<button id="back">◂ timelines</button> · ${esc(titleOf(coord))} · ${dots.length} cards · ${mark(nAcc) || "none accepted"} · ${ns.length > 1 ? ns.length + " notaries" : "notary"} <b>${esc(ns.map(([, n]) => who(n.pubkey)).join(", "))}</b>${myPk ? ` · you: ${esc(who(myPk))}` : ""}`;
    document.getElementById("back").onclick = () => choose(null);
  } else {
    // the timeline of timelines: each subject is one dot at its earliest card, coloured as that card, reaching to its last
    dots = []; let emptyN = 0;
    const subjects = new Set([...notaries.keys()].map(c => c.split(":").slice(2).join(":")));
    const held = new Map();   // card set → the dot already showing it: timelines holding exactly the same cards fold into one dot
    for (const d of subjects){
      const dl = dotsFor(d, fold.projections, all); if (!dl.length){ emptyN++; continue; }
      const key = dl.map(x => x.id).sort().join(" "), ns = notariesOf(d).map(([, n]) => who(n.pubkey)), prev = held.get(key);
      if (prev){   // same cards, another keeper: add the keeper, pool the accepts
        prev.ns.push(...ns.filter(n => !prev.ns.includes(n))); prev.tls.push(d);
        for (const x of dl) prev.all.get(x.id).accs.push(...x.accs.filter(c => !prev.all.get(x.id).accs.includes(c)));
        prev.nAcc = [...prev.all.values()].filter(x => x.accs.length).length; if (prev.accs.length) prev.kind = "acc";
        continue;
      }
      const dot = { ...dl[0], tl:d, tls:[d], card:dl[0], d, title:titleOf(d), created_at:dl[0].created_at, last:dl[dl.length - 1].date,
        n:dl.length, nAcc:dl.filter(x => x.kind === "acc").length, ns, all:new Map(dl.map(x => [x.id, x])) };
      held.set(key, dot); dots.push(dot);
    }
    dots.sort(byDate);
    ntry.innerHTML = `<b>${dots.length}</b> timelines${emptyN ? ` · ${emptyN} empty` : ""}`;
  }
  empty.hidden = dots.length > 0;

  // the band
  const [W0, W1] = windowOf(), span = W1 - W0, ISO = t => new Date(t).toISOString().slice(0, 10);
  band.querySelectorAll(".dot,.tick,.tie,.tail,#now").forEach(e => e.remove());
  const ticks = [];
  if (span > 864e5 * 400){   // years, thinned so labels sit ≥44px apart (1/2/5/10/20/50…)
    const per = band.clientWidth / (span / (864e5 * 365.25)), step = [1, 2, 5, 10, 20, 50, 100].find(k => k * per >= 44) || 100;
    for (let y = Math.ceil(new Date(W0).getUTCFullYear() / step) * step; Date.UTC(y,0,1) < W1; y += step) ticks.push([Date.UTC(y,0,1), String(y)]);
  }
  else if (span > 864e5 * 40) for (let t = new Date(W0), i = 0; i < 14; i++){ const y = t.getUTCFullYear(), m = t.getUTCMonth() + i; const at = Date.UTC(y, m, 1); if (at >= W1) break; if (at >= W0) ticks.push([at, MON[m % 12]]); }
  else for (let t = W0; t < W1; t += 864e5){ const d = new Date(t), n = d.getUTCDate(); if (n % 5 === 1) ticks.push([t, (n === 1 || !ticks.length ? MON[d.getUTCMonth()] + " " : "") + n]); }   // days say their month at its start and at the window's first tick
  for (const [t, label] of ticks){ const f = frac(t, W0, W1); if (f < 0.015 || f > 0.985) continue;   // a label on the edge would clip
    const e = document.createElement("div"); e.className = "tick"; e.style.left = f * 100 + "%"; e.textContent = label; band.appendChild(e); }
  const nowT = T(NOW); if (nowT > W0 && nowT < W1){ const e = document.createElement("div"); e.id = "now"; e.style.left = frac(nowT, W0, W1) * 100 + "%"; e.innerHTML = "<i>now</i>"; band.appendChild(e); }

  // zooming in grows the dots: 11px at the whole record, up to 22px at a month
  const full = windowOf(true), DOT = Math.round(11 * Math.max(1, Math.min(2, Math.sqrt((full[1] - full[0]) / span))));
  band.style.setProperty("--dot", DOT + "px");
  // one dot per cluster: dots whose centres would land within a dot-width of each other merge, accepted first;
  // a second dot one deep says +N for the rest — open it to see what shares the spot (a day's rivals, or a dense year)
  const AX = 78, STEP = DOT + 13, PX = band.clientWidth / 100, groups = [];
  dots.forEach((x, i) => { x.i = i; x.x = frac(T(x.date), W0, W1) * 100; x.y = null; x.g = null; });
  for (const x of [...dots].sort((a, b) => a.x - b.x)){
    if (x.x < 0 || x.x > 100) continue;
    const g = groups[groups.length - 1];
    if (g && (x.x - g[0].x) * PX <= DOT + 2) g.push(x); else groups.push([x]);
  }
  for (const x of dots) if (x.last > x.date && T(x.last) > W0 && T(x.date) < W1){ const e = document.createElement("div"); e.className = "tail"; e.style.top = AX + "px";
    e.style.left = Math.max(0, x.x) + "%"; e.style.width = Math.min(100, frac(T(x.last), W0, W1) * 100) - Math.max(0, x.x) + "%"; band.insertBefore(e, band.firstChild); }
  groups.forEach((ids, gi) => {
    const cx = ids.reduce((s, x) => s + x.x, 0) / ids.length;
    ids.sort((a, b) => (a.kind === "acc" ? 0 : 1) - (b.kind === "acc" ? 0 : 1) || b.created_at - a.created_at);
    for (const x of ids.slice(0, 2)){
      x.y = x === ids[0] ? AX : AX - STEP; x.g = gi;
      const e = document.createElement("button");
      e.className = "dot " + (x.kind === "acc" ? "acc" : "sub") + (x.date > NOW ? " future" : "") + (x.i === open ? " on" : "");
      e.dataset.i = x.i; e.style.left = cx + "%"; e.style.top = x.y + "px"; if (x !== ids[0]) e.dataset.n = ids.length - 1;
      // the deep dot is a door: its click spreads the cluster (window = its days); on one day there is nothing to spread, so it opens
      const lo = ids.reduce((m, o) => o.date < m ? o.date : m, ids[0].date), hi = ids.reduce((m, o) => o.date > m ? o.date : m, ids[0].date), deep = x !== ids[0] && hi > lo;
      e.setAttribute("aria-label", x === ids[0] ? x.date + " " + x.title : `${ids.length - 1} more here, ${lo} to ${hi}` + (deep ? ", click spreads them" : ""));
      e.onclick = deep ? () => { const pad = Math.max((T(hi) - T(lo)) * 0.08, 864e5); win = [T(lo) - pad, T(hi) + pad]; render(); } : () => go(x.i);
      e.onmouseenter = deep ? () => { ledger.innerHTML = `<b>${ids.length} here</b> · ${lo} → ${hi} · <span class="t2">click to spread</span>`; } : () => line(x.i);
      e.onmouseleave = () => line(open);
      band.appendChild(e);
    }
    ids.forEach(x => x.g = gi);
    if (ids.length > 1){ const e = document.createElement("div"); e.className = "tie"; e.style.left = cx + "%"; e.style.top = AX - STEP + "px"; e.style.height = STEP + "px"; band.insertBefore(e, band.firstChild); }
  });

  // scrub: whole years, first to last the record touches — fixed, so the bar never rescales under the pointer
  scrub.innerHTML = "";
  const ys = dots.length ? dots.map(x => +x.date.slice(0, 4)) : [new Date(NOW).getUTCFullYear()];
  const A0 = Date.UTC(Math.min(...ys), 0, 1), A1 = Date.UTC(Math.max(...ys) + 1, 0, 1), pct = t => Math.max(0, Math.min(1, frac(t, A0, A1))) * 100 + "%";
  for (const x of [...dots].sort((a, b) => (a.kind === "acc" ? 1 : 0) - (b.kind === "acc" ? 1 : 0))){ const e = document.createElement("div"); e.className = "d" + (x.kind === "acc" ? " acc" : "") + (x.date > NOW ? " future" : ""); e.style.left = pct(T(x.date)); scrub.appendChild(e); }
  if (nowT > A0 && nowT < A1){ const e = document.createElement("div"); e.className = "now"; e.style.left = pct(nowT); scrub.appendChild(e); }
  const w = document.createElement("div"); w.className = "win"; w.style.left = pct(W0); w.style.width = `calc(${pct(W1)} - ${pct(W0)})`; w.innerHTML = '<div class="h l"></div><div class="h r"></div>'; scrub.appendChild(w);
  // the window says its own dates at each edge, like histography; a label that would run off the bar flips inside
  // (LW = one label's width; a flipped-in label on a box narrower than that pushes the other label out past it)
  const LW = 88, room = LW / scrub.clientWidth, fl = frac(W0, A0, A1) < room, fr = frac(W1, A0, A1) > 1 - room;
  const L = fr ? `min(${pct(W0)}, calc(${pct(W1)} - ${LW}px))` : pct(W0), R = fl ? `max(${pct(W1)}, calc(${pct(W0)} + ${LW}px))` : pct(W1);
  for (const [cls, t, at, f] of [["ed l", W0, L, fl], ["ed r", W1 - 864e5, R, fr]]){ const e = document.createElement("div"); e.className = cls + (f ? " in" : ""); e.style.left = at; e.textContent = ISO(t); scrub.appendChild(e); }
  scrub.dataset.a0 = A0; scrub.dataset.a1 = A1;

  column(); if (dots.length) show(open !== null && dots[open] ? open : 0, false); else line(null);   // something is always open: the first card until the reader moves
}

function line(i){
  if (i === null || !dots[i]){
    const n = dots.filter(x => x.x >= 0 && x.x <= 100).length;   // nothing open: say what the window holds (cards, not drawn dots), so an empty scrub stop is not a dead screen
    const [a, b] = windowOf(), lbl = new Date(a).toISOString().slice(0, 10) + " → " + new Date(b - 864e5).toISOString().slice(0, 10);
    ledger.innerHTML = win ? `<span class="t2">${n ? `${n} in ${lbl}` : `nothing in ${lbl}`}</span>` : "&nbsp;"; return; }
  const x = dots[i], vers = dots.filter(o => o.d === x.d).length, same = x.g === null ? 0 : dots.filter(o => o.g === x.g).length - 1;
  ledger.innerHTML = x.tl ? `<b>${esc(x.title)}</b> · ${x.n} cards${same > 0 ? ` · ${same} more here` : ""}`
    : `<b>${esc(x.date)}</b> · ${esc(x.title || x.summary || x.content.slice(0, 60))} · ${accsOf(x.id).length ? mark(accsOf(x.id).length) : '<span class="s">submitted</span>'} · ${esc(who(x.author))}${vers > 1 ? ` · ${vers} versions` : ""}${same > 0 ? ` · ${same} more here` : ""}`;
}
function article(x){   // one card's block in the column; a timeline's block leads with its collection line and an open ▸
  const c = x.card || x, accs = accsOf(c.id), i = x.i, vers = dots.filter(o => o.d === x.d), day = new Date(c.created_at * 1000).toISOString().slice(0, 10);
  return `<article class="c${x.kind === "acc" ? " acc" : ""}" data-i="${i}">${x.tl ? `<div class="tl"><h2>${esc(x.title)}</h2><div class="meta">${x.n} cards · ${mark(x.nAcc) || "none accepted"} · <b>${esc(x.date)}</b>${x.last > x.date ? ` → <b>${esc(x.last)}</b>` : ""} · ${x.tls?.length > 1 ? "held by" : x.ns.length > 1 ? x.ns.length + " notaries" : "notary"} <b>${esc(x.ns.join(", "))}</b></div><button class="go">open timeline ▸</button></div>` : ""}
  <h2>${esc(c.title) || "<i>untitled</i>"}</h2>
  <div class="meta"><b>${esc(c.date)}${c.time ? " " + esc(c.time) : ""}</b> · ${accs.length ? mark(accs.length) : "submitted"} · by <b>${esc(who(c.author))}</b> · ${day}${c.date > NOW ? " · upcoming" : ""}${isMine(c) ? " · yours" : ""}</div>
  ${c.summary ? `<div class="sum">${esc(c.summary)}</div>` : ""}
  ${prose(c.content)}
  ${vers.length > 1 ? `<div class="vers">${vers.map(o => `<button data-i="${o.i}"${o.i === i ? ' class="on"' : ""}>${esc(who(o.author))} · ${new Date(o.created_at * 1000).toISOString().slice(0, 10)}${accsOf(o.id).length ? " " + mark(accsOf(o.id).length) : ""}</button>`).join("")}</div>` : ""}
  <div class="foot">d ${esc(c.d)} · <a href="https://njump.me/${esc(c.id)}" target="_blank" rel="noopener noreferrer">njump</a></div></article>`;
}
function column(){   // rebuilt only when the cards themselves change, so a zoom never loses the reader's place
  const key = dots.map(x => x.id + x.kind + (x.tl || "") + accsOf(x.id).length).join("|"); if (key === colKey) return; colKey = key;
  card.innerHTML = dots.map((x, i) => {   // a day holding several cards gets a day line above its group: the neighbours are visible, nothing is claimed about them
    if (x.date === dots[i - 1]?.date) return article(x);
    const g = dots.filter(o => o.date === x.date); if (g.length < 2) return article(x);
    const ts = g.map(o => (o.card || o).time).filter(Boolean);
    return `<div class="day">${esc(x.date)} · ${g.length} ${coord ? "cards" : "timelines"}${ts.length ? ` · ${esc(ts[0])}${ts.length > 1 ? " → " + esc(ts[ts.length - 1]) : ""}` : ""}</div>` + article(x);
  }).join("");
  card.querySelectorAll(".vers button").forEach(b => b.onclick = () => go(+b.dataset.i));
  card.querySelectorAll(".go").forEach(b => b.onclick = () => choose(dots[+b.closest("article").dataset.i].tl));
}
function show(i, scroll = true){   // open = card i: its dot and block light up; scroll = bring the block under the map
  const x = dots[i]; open = i; x.tl ? line(null) : line(i);   // a timeline's block says it all; the ledger only previews on hover
  band.querySelectorAll(".dot").forEach(e => e.classList.toggle("on", +e.dataset.i === i));
  const art = card.querySelector(`article[data-i="${i}"]`); card.querySelectorAll("article").forEach(e => e.classList.toggle("on", e === art));
  if (scroll && art) scrollTo(0, scrollY + art.getBoundingClientRect().top - mapEl.offsetHeight - 14);   // the map sticks at the top once the header has scrolled off, so aim under its stuck height, not where it sits now
}
function reveal(i){   // card i off a zoomed window? the window grows that way to take it in; the other edge stays put
  if (!win || !dots[i]) return;
  const a0 = +scrub.dataset.a0, a1 = +scrub.dataset.a1, t = T(dots[i].date); let [W0, W1] = win; const pad = Math.max(864e5, (W1 - W0) / 20);
  if (t < W0) W0 = Math.max(a0, snap(t - pad)); else if (t >= W1) W1 = Math.min(a1, snap(t + pad));
  if (W0 !== win[0] || W1 !== win[1]){ win = W0 <= a0 && W1 >= a1 ? null : [W0, W1]; render(); }
}
const go = i => { reveal(i); show(i); };

// ── controls ──
const ntry = document.getElementById("ntry"),
  st = document.getElementById("st"), band = document.getElementById("band"), empty = document.getElementById("empty"),
  ledger = document.getElementById("ledger"), card = document.getElementById("card"), scrub = document.getElementById("scrub"), mapEl = document.getElementById("top");
// wheel over the band: zoom about the day under the pointer, never past the record's years or under a day
band.addEventListener("wheel", e => {
  e.preventDefault();
  const [W0, W1] = windowOf(), a0 = +scrub.dataset.a0, a1 = +scrub.dataset.a1, k = e.deltaY > 0 ? 1.25 : 0.8;
  const t = W0 + (e.clientX - band.getBoundingClientRect().left) / band.clientWidth * (W1 - W0);
  let n0 = Math.max(a0, t - (t - W0) * k), n1 = Math.min(a1, t + (W1 - t) * k);
  if (n1 - n0 < 864e5) return;
  win = n0 <= a0 && n1 >= a1 ? null : [n0, n1]; render();
}, { passive:false });
// scrub, like histography: drag an edge = resize, drag the box = move, press elsewhere = the box jumps there keeping its width; never narrower than a day
let grab = null;   // {mode:"l"|"r"|"m", off}  off = pointer − W0 in ms, for a move
const atX = ev => { const a0 = +scrub.dataset.a0, a1 = +scrub.dataset.a1; return a0 + Math.max(0, Math.min(1, (ev.clientX - scrub.getBoundingClientRect().left) / scrub.clientWidth)) * (a1 - a0); };
const snap = t => Math.round(t / 864e5) * 864e5;
scrub.onpointerdown = ev => {
  scrub.setPointerCapture(ev.pointerId);
  const [W0, W1] = windowOf(), t = atX(ev), h = ev.target.closest(".h");
  grab = h ? { mode: h.classList.contains("l") ? "l" : "r" } : ev.target.closest(".win") ? { mode: "m", off: t - W0 } : { mode: "m", off: (W1 - W0) / 2 };
  drag(ev);
};
scrub.onpointermove = ev => { if (ev.buttons && grab) drag(ev); };
scrub.onpointerup = () => { grab = null; };
function drag(ev){
  const a0 = +scrub.dataset.a0, a1 = +scrub.dataset.a1, t = snap(atX(ev)); let [W0, W1] = windowOf();
  if (grab.mode === "l") W0 = Math.min(t, W1 - 864e5);
  else if (grab.mode === "r") W1 = Math.max(t, W0 + 864e5);
  else { const w = W1 - W0; W0 = Math.max(a0, Math.min(a1 - w, snap(t - grab.off))); W1 = W0 + w; }
  if (W0 !== win?.[0] || W1 !== win?.[1]){ win = [W0, W1]; render(); }
}
// the bar under focus steers the window: arrows move it a tenth of its width, up/down zoom about its middle, home/end jump, escape = whole record
scrub.onkeydown = e => {
  const a0 = +scrub.dataset.a0, a1 = +scrub.dataset.a1; let [W0, W1] = windowOf(); const w = W1 - W0, m = (W0 + W1) / 2;
  const k = { ArrowLeft: -1, ArrowRight: 1 }[e.key], z = { ArrowUp: 0.8, ArrowDown: 1.25 }[e.key];
  if (k){ W0 = Math.max(a0, Math.min(a1 - w, snap(W0 + k * Math.max(864e5, w / 10)))); W1 = W0 + w; }
  else if (z){ W0 = Math.max(a0, snap(m - w / 2 * z)); W1 = Math.min(a1, snap(m + w / 2 * z)); if (W1 - W0 < 864e5) return; }
  else if (e.key === "Home"){ W0 = a0; W1 = a0 + w; } else if (e.key === "End"){ W1 = a1; W0 = a1 - w; }
  else if (e.key === "Escape"){ W0 = a0; W1 = a1; } else return;
  e.preventDefault(); win = W0 <= a0 && W1 >= a1 ? null : [W0, W1]; render();
};
document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight" || e.target.matches("select,input,textarea") || e.target === scrub) return;
  if (dots.length) go(Math.max(0, Math.min(dots.length - 1, (open ?? -1) + (e.key === "ArrowRight" ? 1 : -1))));   // dots are in date order: next card, on screen or not
});
// scrolling the column: the block under the map is the open one — its dot lights and the window grows to hold it
addEventListener("scroll", () => {
  const at = mapEl.getBoundingClientRect().bottom + 15; let hit = null;
  for (const a of card.querySelectorAll("article")) if (a.getBoundingClientRect().top <= at) hit = a; else break;
  const i = hit ? +hit.dataset.i : 0; if (card.children.length && i !== open){ reveal(i); show(i, false); }
}, { passive:true });

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });   // label thinning depends on width
render();
RELAYS.forEach(connect);
</script>
</body>
